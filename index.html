    do_pixel:"wx = 0.5 + 0.5 * sin(x * freq_x * 6.28318 + t * speed); wy = 0.5 + 0.5 * sin(y * freq_y * 6.28318 + t * speed * 0.7); wx * wy",
    params:{freq_x:{value:15,min:2,max:60},freq_y:{value:15,min:2,max:60},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","wave","mesh","fabric","animated"], why:"Two crossing wave patterns creating a mesh/fabric. From t06 fabric patterns." } },
  { cat:"PP-0B7", date:"2026-08-15", type:"gizmo", title:"Wavy Grid", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * cols; py = y * rows; dx = px + sin(py * waveFreq + t * speed) * waveAmp; dy = py + sin(px * waveFreq + t * speed) * waveAmp; gx = abs(dx - floor(dx + 0.5)); gy = abs(dy - floor(dy + 0.5)); d = min(gx, gy); smoothstep(width, 0.0, d)",
    params:{cols:{value:8,min:2,max:30},rows:{value:8,min:2,max:30},waveFreq:{value:2,min:0.5,max:8},waveAmp:{value:0.3,min:0,max:1},width:{value:0.08,min:0.02,max:0.3},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["pattern","grid","wavy","sine","distortion","animated"], why:"Sine-distorted grid: regular grid lines wobble with sinusoidal displacement. GridWarp uses noise for organic warping; WavyGrid uses pure sine for rhythmic, breath-like motion. Useful for textile, water surface, and op-art patterns." } },
  { cat:"PP-0B8", date:"2026-08-15", type:"gizmo", title:"Windmill Tile", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx - 0.5; fy = y * cells - gy - 0.5; bx = gx - floor(gx * 0.5) * 2.0; by = gy - floor(gy * 0.5) * 2.0; rot = (bx + by * 2.0) * 1.5708; rx = fx * cos(rot) - fy * sin(rot); ry = fx * sin(rot) + fy * cos(rot); 0.5 + 0.5 * sin((rx + ry) * detail * 6.28318 + t * speed)",
    params:{cells:{value:8,min:2,max:24},detail:{value:2,min:0.5,max:10},speed:{value:0.3,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","pinwheel","windmill","tile","rotation","grid","animated"], why:"Pinwheel-rotated square tiles: each 2x2 block of cells has tiles rotated 0, 90, 180, 270 degrees based on position parity. A diagonal stripe pattern inside each tile appears to spin like windmill blades. The rotation uses position-in-block (bx + by*2) mapped to quarter-turn multiples. Mined from LYGIA space/ tile rotation and Islamic geometric pattern literature." } },
  { cat:"PP-0B9", date:"2026-08-15", type:"gizmo", title:"Wood Ring", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); n = noise2(x * scale + t * drift, y * scale); v = sin(d * freq + n * warp); 0.5 + 0.5 * v",
    params:{scale:{value:4,min:0.5,max:20},freq:{value:20,min:2,max:60},warp:{value:2,min:0,max:10},drift:{value:0.01,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["noise","wood","texture","organic","radial","animated"], why:"Wood grain: sin(radial_distance + noise * warp) creates concentric growth rings distorted by noise. From Book of Shaders ch.13 — the companion to MarbleVein. Freq controls ring density, warp controls organic distortion." } },
  { cat:"PP-0BA", date:"2026-08-15", type:"gizmo", title:"Woven Grid", tags:["Gizmo","Interactive"],
    do_pixel:"sx = sin(y * grid_freq * 6.28318 + t * speed) * wave_amount; sy = sin(x * grid_freq * 6.28318 + t * speed * 0.8) * wave_amount; warp_x = x + sx; warp_y = y + sy; gx = 0.5 + 0.5 * sin(warp_x * grid_freq * 6.28318); gy = 0.5 + 0.5 * sin(warp_y * grid_freq * 6.28318); cell = floor(x * grid_freq) + floor(y * grid_freq); over = (cell % 2 == 0) ? gx * (1.0 - gy * 0.5) : gy * (1.0 - gx * 0.5); clamp(over, 0.0, 1.0)",
    params:{grid_freq:{value:10,min:2,max:40},wave_amount:{value:0.1,min:0,max:0.5},speed:{value:0.03,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","weave","woven","fabric","grid","animated"], why:"Two perpendicular wave patterns with over-under weave illusion. From t06 weave/fabric patterns." } },
  { cat:"PP-0BB", date:"2026-08-15", type:"gizmo", title:"XOR Field", tags:["Gizmo","Interactive"],
    do_pixel:"ix = floor(x * scale + t * shear * scale); iy = floor(y * scale); v = (ix % 256 + 256) % 256; w = (iy % 256 + 256) % 256; xv = floor(v / 128) != floor(w / 128); v2 = (v % 128); w2 = (w % 128); xv2 = floor(v2 / 64) != floor(w2 / 64); v3 = (v % 64); w3 = (w % 64); xv3 = floor(v3 / 32) != floor(w3 / 32); v4 = (v % 32); w4 = (w % 32); xv4 = floor(v4 / 16) != floor(w4 / 16); v5 = (v % 16); w5 = (w % 16); xv5 = floor(v5 / 8) != floor(w5 / 8); v6 = (v % 8); w6 = (w % 8); xv6 = floor(v6 / 4) != floor(w6 / 4); v7 = (v % 4); w7 = (w % 4); xv7 = floor(v7 / 2) != floor(w7 / 2); xv8 = (v % 2) != (w % 2); result = xv * 128 + xv2 * 64 + xv3 * 32 + xv4 * 16 + xv5 * 8 + xv6 * 4 + xv7 * 2 + xv8; result / 255.0",
    params:{scale:{value:64,min:8,max:512},shear:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","xor","digital","arithmetic","animated"], why:"Pure arithmetic pattern from binary operations — XOR on pixel coordinates. From t06_038 XOR glyph-maker." } },
  { cat:"PP-0BC", date:"2026-08-15", type:"gizmo", title:"Zigzag", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * cols; tri = abs(px - floor(px + 0.5)) * 2.0; sy = y * rows + tri * amplitude; d = abs(sy - floor(sy + 0.5)); smoothstep(width, 0.0, d)",
    params:{cols:{value:4,min:1,max:16},rows:{value:8,min:2,max:30},amplitude:{value:0.5,min:0,max:2},width:{value:0.15,min:0.02,max:0.4}},
    dna:{ author:"makers-factory", tags:["pattern","zigzag","chevron","stripe","geometric"], why:"Chevron/zigzag stripes: triangle wave offsets horizontal stripes to create V-shaped patterns. Amplitude controls the zigzag depth, rows controls stripe density. The simplest geometric pattern that creates directional visual flow without curves." } },

const tagRow = p => `<div class="tags"><span class="cat">${p.cat}</span>${
  p.tags.map(x=>`<span>${x}</span>`).join("")
}<span class="date">${p.date}</span></div>`;

const R = {
  patch:(p)=>{
    const id = p.cat.toLowerCase().replace("-","");
    const sliders = p.def.params ? Object.entries(p.def.params).map(([k,v])=>
      `<label>${k} <input type="range" min="${v.min}" max="${v.max}" step="any" value="${v.value}" data-param="${k}"><span class="val">${(+v.value).toFixed(2)}</span></label>`
    ).join("") : "";
    return `<article class="post">${tagRow(p)}<h2>${p.title}</h2>
      <div class="media"><div class="frame r11" id="${id}"><canvas id="${id}c"></canvas>
      <div class="corner">${p.cat}</div></div></div>
      <div class="wire-row" id="${id}w"><span class="wire">${p.cat}.${p.chain.fromPort} &rarr; ${p.chain.to}.${p.chain.toPort}</span> &middot; float</div>
      ${sliders ? `<div class="gizmo-panel" data-gizmo="${id}">${sliders}</div>` : ""}
      <div class="dl-row">${p.downloads.map(d=>`<a href="${d.href}" download>${d.label}</a>`).join("")}</div>
      ${p.dna && p.dna.why ? `<p>${p.dna.why}</p>` : ""}</article>`;
  },

  gizmo:(p)=>{
    const id = p.cat.toLowerCase().replace("-","");
    const sliders = p.params ? Object.entries(p.params).map(([k,v])=>
      `<label>${k} <input type="range" min="${v.min}" max="${v.max}" step="any" value="${v.value}" data-param="${k}"><span class="val">${(+v.value).toFixed(2)}</span></label>`
    ).join("") : "";
    return `<article class="post">${tagRow(p)}<h2>${p.title}</h2>
      <div class="media"><div class="frame r11" id="${id}"><canvas id="${id}c"></canvas>
      <div class="corner">${p.cat}</div></div></div>
      ${sliders ? `<div class="gizmo-panel" data-gizmo="${id}">${sliders}</div>` : ""}
      ${p.dna && p.dna.why ? `<p>${p.dna.why}</p>` : ""}</article>`;
  },

  webgl:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div class="media"><div class="frame r45" id="wgl"><canvas id="wglc"></canvas>
    <div class="corner">${p.note}</div></div></div></article>`,
  cracktro:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div class="media"><div class="frame r43" id="ctro"><canvas id="ctroc"></canvas>
    <div class="corner">${p.note}</div></div></div></article>`,
  text:(p)=>`<article class="post is-text">${tagRow(p)}<h2>${p.title}</h2>
    <div style="height:10px"></div>${p.body.map(t=>`<p>${t}</p>`).join("")}</article>`,
  music:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div class="audio" id="deck"><button class="playbtn" id="playbtn" aria-pressed="false">Play</button>
    <div class="wave" aria-hidden="true">${"<span></span>".repeat(28)}</div></div>
    ${p.body.map(t=>`<p>${t}</p>`).join("")}</article>`,
  game:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div style="height:8px"></div>${p.body.map(t=>`<p>${t}</p>`).join("")}
    <p style="margin-top:12px"><a class="plain" href="${p.href}">${p.cta}</a></p></article>`,
  image:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div class="media"><img class="art" src="${p.src}" alt="${p.alt||p.title}" loading="lazy"></div>
    ${(p.body||[]).map(t=>`<p>${t}</p>`).join("")}</article>`,
  video:(p)=> p.src
    ? `<article class="post">${tagRow(p)}<h2>${p.title}</h2>
      <div class="media"><video class="art" src="${p.src}" ${p.poster?`poster="${p.poster}"`:""}
      controls playsinline preload="metadata" ${p.loop?"loop muted autoplay":""}></video></div>
      ${(p.body||[]).map(t=>`<p>${t}</p>`).join("")}</article>`
    : `<article class="post">${tagRow(p)}<h2>${p.title}</h2>
      <div class="media"><div class="frame r169 is-slot"><span>Slot reserved</span></div></div>
      ${(p.body||[]).map(t=>`<p>${t}</p>`).join("")}</article>`,
  lock:(p)=>`<article class="post">${tagRow(p)}<h2>${p.title}</h2>
    <div style="height:8px"></div>${p.body.map(t=>`<p>${t}</p>`).join("")}
    <form class="lock" id="lockform"><input type="email" required placeholder="you@somewhere.net" aria-label="Email address">
    <button type="submit">Follow</button></form><div class="lock-msg" id="lockmsg"></div></article>`,
};
document.getElementById("feed").innerHTML = POSTS.map(p=>R[p.type](p)).join("");
document.getElementById("yr").textContent = new Date().getFullYear();

/* ============================================================
   DUSTFIELD — WebGL fragment shader, tap-reactive
   ============================================================ */
(function(){
  const cv = document.getElementById("wglc"), wrap = document.getElementById("wgl");
  const gl = cv.getContext("webgl");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!gl){ wrap.querySelector(".corner").textContent = "webgl unavailable"; return; }

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `
  precision mediump float;
  uniform vec2 u_res; uniform float u_t; uniform vec3 u_click;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float v=0., a=.5; for(int k=0;k<5;k++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*u_res)/u_res.y;
    float t = u_t*.05;
    float d = length(uv - u_click.xy);
    float age = u_t - u_click.z;
    float wave = exp(-3.*age) * sin(18.*d - 7.*age) * smoothstep(1.2, 0., d);
    uv += normalize(uv - u_click.xy + 1e-4) * wave * .05;
    float n = fbm(uv*2.4 + vec2(t, -t*.6));
    n += .35*fbm(uv*6. - vec2(t*1.7, 0.));
    // monochrome dust: silver on black, quiet
    vec3 dust = mix(vec3(.015), vec3(.55,.56,.58), smoothstep(.5,1.02,n));
    vec2 sp = uv*u_res.y*.045 + vec2(t*4., 0.);
    float s = step(.997, hash(floor(sp))) * fract(sin(u_t + hash(floor(sp))*99.)*.5+.5);
    vec2 sp2 = uv*u_res.y*.09 + vec2(t*9., 0.);
    float s2 = step(.9985, hash(floor(sp2)));
    vec3 col = dust + (s*.95 + s2*.6)*vec3(1.);
    col += vec3(1.) * max(wave,0.) * .5;
    col *= 1. - .5*dot(uv,uv);
    gl_FragColor = vec4(col,1.);
  }`;
  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,"p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes = gl.getUniformLocation(prog,"u_res"),
        uT   = gl.getUniformLocation(prog,"u_t"),
        uC   = gl.getUniformLocation(prog,"u_click");
  let click = [10,10,-99], t0 = performance.now();

  function size(){
    const dpr = Math.min(devicePixelRatio||1, 2), r = wrap.getBoundingClientRect();
    cv.width = r.width*dpr; cv.height = r.height*dpr;
    gl.viewport(0,0,cv.width,cv.height);
  }
  size(); addEventListener("resize", size);

  wrap.addEventListener("pointerdown", e=>{
    const r = wrap.getBoundingClientRect();
    const x = ((e.clientX-r.left)/r.width  - .5) * (r.width/r.height);
    const y = -((e.clientY-r.top)/r.height - .5);
    click = [x, y, (performance.now()-t0)/1000];
  });

  function draw(){
    const t = (performance.now()-t0)/1000;
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uT, reduced ? 0 : t);
    gl.uniform3f(uC, click[0], click[1], click[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============================================================
   LOADER — original cracktro homage (ST/Amiga era style).
   Low-res 2D canvas, upscaled pixelated. Tap cycles the copper.
   ============================================================ */
(function(){
  const cv = document.getElementById("ctroc"), wrap = document.getElementById("ctro");
  if(!cv) return;
  const ctx2 = cv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const W = 320, H = 240;                     // authentic low resolution
  cv.width = W; cv.height = H;

  const SCROLL = "   +++ PROGRAMMABLE PIXELS PRESENTS ... BELTMINER +++ " +
    "NO CRACK NEEDED - IT WAS FREE ALL ALONG +++ CODE, GFX AND MUSIC BY ONE OPERATOR +++ " +
    "GREETINGS FLY OUT TO THE BELT ... AND TO EVERYONE STILL READING SINE SCROLLERS IN " +
    (new Date().getFullYear()) + " +++ PRESS PLAY ON TAPE +++      ";

  // copper palettes — tap to cycle
  const PALETTES = [
    ["#1a0533","#7b2ff7","#f107a3","#ffb3f6"],
    ["#001b2e","#0f7bd4","#5fd0ff","#dff6ff"],
    ["#1c1c1c","#4d4d4d","#bfbfbf","#ffffff"],   // house monochrome
    ["#2b1a00","#c96f00","#ffc400","#fff2b3"],
  ];
  let pal = 0;
  wrap.addEventListener("pointerdown", ()=>{ pal = (pal+1) % PALETTES.length; });

  let t = 0;
  function draw(){
    const P = PALETTES[pal];
    ctx2.fillStyle = "#000"; ctx2.fillRect(0,0,W,H);

    // copper bars: horizontal raster gradients breathing up and down
    for(let i=0; i<5; i++){
      const cy = H*0.5 + Math.sin(t*.02 + i*1.2)*70;
      for(let r=-10; r<=10; r++){
        const shade = P[Math.max(0, 3 - Math.floor(Math.abs(r)/3.4))];
        ctx2.fillStyle = shade;
        ctx2.globalAlpha = .5;
        ctx2.fillRect(0, cy+r, W, 1);
      }
    }
    ctx2.globalAlpha = 1;

    // ASCII block logo: "PP!" built from characters — the pixels ARE text
    ctx2.font = "10px monospace";
    ctx2.textBaseline = "top";
    const LOGO = [
      "  ___   ___    _ ",
      " | _ \\ | _ \\  | |",
      " |  _/ |  _/  |_|",
      " |_|   |_|    (_)",
    ];
    const ly = 28 + (reduced ? 0 : Math.sin(t*.03)*6);
    LOGO.forEach((row,i)=>{
      ctx2.fillStyle = "#000"; ctx2.fillText(row, 111, ly + i*11 + 1);
      ctx2.fillStyle = P[3];   ctx2.fillText(row, 110, ly + i*11);
    });
    ctx2.fillStyle = P[2];
    ctx2.font = "8px monospace";
    ctx2.fillText("P R O G R A M M A B L E   P I X E L S", 62, ly + 50);

    // sine scroller along the bottom, letter by letter
    ctx2.font = "bold 14px monospace";
    const speed = reduced ? 0 : 1.6;
    const off = Math.floor(t*speed);
    for(let i=0; i<28; i++){
      const ch = SCROLL[(Math.floor(off/9) + i) % SCROLL.length];
      const x = i*12 - (off % 9);
      const y = 190 + (reduced ? 0 : Math.sin((t*.06) + i*.55)*14);
      ctx2.fillStyle = "#000"; ctx2.fillText(ch, x+1, y+1);
      ctx2.fillStyle = P[3];   ctx2.fillText(ch, x, y);
    }

    // scanlines
    ctx2.fillStyle = "rgba(0,0,0,.25)";
    for(let y=0; y<H; y+=2) ctx2.fillRect(0,y,W,1);

    t++;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============================================================
   BELT AMBIENT 01 — generative Web Audio
   ============================================================ */
(function(){
  const btn = document.getElementById("playbtn"),
        deck = document.getElementById("deck"),
        bars = deck.querySelectorAll(".wave span");
  let ctx, master, timer = null, vuTimer = null;
  const scale = [0, 3, 5, 7, 10, 12, 15];
  const base = 110;

  function boot(){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = .5;
    const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 1800;
    master.connect(lp).connect(ctx.destination);
    [0, 4].forEach(det=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="sawtooth"; o.frequency.value = base/2; o.detune.value = det;
      g.gain.value = .05; o.connect(g).connect(master); o.start();
    });
  }
  function pluck(){
    const st = scale[Math.floor(Math.random()*scale.length)];
    const oct = Math.random() < .3 ? 2 : 1;
    const f = base * Math.pow(2, st/12) * oct;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    const now = ctx.currentTime;
    g.gain.setValueAtTime(.0001, now);
    g.gain.exponentialRampToValueAtTime(.22, now+.02);
    g.gain.exponentialRampToValueAtTime(.0001, now+1.4);
    o.connect(g).connect(master); o.start(now); o.stop(now+1.5);
  }
  function start(){
    if(!ctx) boot();
    ctx.resume();
    timer = setInterval(()=>{ if(Math.random()<.75) pluck(); }, 480);
    vuTimer = setInterval(()=>bars.forEach(b=>b.style.height = (2+Math.random()*30)+"px"), 130);
    deck.classList.add("playing");
    btn.textContent = "Stop"; btn.setAttribute("aria-pressed","true");
  }
  function stop(){
    clearInterval(timer); clearInterval(vuTimer); timer = null;
    if(ctx) ctx.suspend();
    bars.forEach(b=>b.style.height = "2px");
    deck.classList.remove("playing");
    btn.textContent = "Play"; btn.setAttribute("aria-pressed","false");
  }
  btn.addEventListener("click", ()=> timer ? stop() : start());
})();


/* ============================================================
   GIZMO PLAYER — compiles do_pixel expressions into live
   per-pixel canvases with parameter sliders.
   Each gizmo is its own tiny shader, running on a 2D canvas.
   ============================================================ */
(function(){
  const SIZE = 256;
  const gizmos = POSTS.filter(p => p.type === "gizmo");
  if (!gizmos.length) return;

  /* --- Simplex-style 2D noise (compact, self-contained) --- */
  const perm = new Uint8Array(512);
  (function(){ const p=[]; for(let i=0;i<256;i++) p[i]=i;
    for(let i=255;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
    for(let i=0;i<512;i++) perm[i]=p[i&255];
  })();
  function grad2(h,x,y){ const u=h<4?x:y, v=h<4?y:x; return((h&1)?-u:u)+((h&2)?-v:v); }
  function noise2(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=x*x*x*(x*(x*6-15)+10), v=y*y*y*(y*(y*6-15)+10);
    const a=perm[X]+Y, b=perm[X+1]+Y;
    return .5+.5*(
      (1-v)*((1-u)*grad2(perm[a]&15,x,y)+u*grad2(perm[b]&15,x-1,y))
      +v*((1-u)*grad2(perm[a+1]&15,x,y-1)+u*grad2(perm[b+1]&15,x-1,y-1))
    );
  }

  /* --- do_pixel compiler --- */
  const {sin,cos,sqrt,abs,atan2,PI,floor,ceil,min,max,pow,exp,log} = Math;
  function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
  function smoothstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
  function fmod(a,b){ return a - b * Math.floor(a/b); }

  /* tan, acos, round — standard Math, just not injected yet */
  const {tan, acos, round} = Math;

  /* turbulence2 — sum of absolute-value noise octaves (fBM with abs) */
  function turbulence2(x, y, oct) {
    oct = oct || 4;
    var val = 0, amp = 1, freq = 1, total = 0;
    for(var i = 0; i < oct; i++) {
      val += amp * abs(noise2(x * freq, y * freq) * 2 - 1);
      total += amp;
      amp *= 0.5;
      freq *= 2;
    }
    return val / total;
  }

  /* voronoi2 — Worley cellular noise, returns distance to nearest point */
  function voronoi2(x, y) {
    var ix = floor(x), iy = floor(y);
    var fx = x - ix, fy = y - iy;
    var md = 8.0;
    for(var j = -1; j <= 1; j++) {
      for(var i = -1; i <= 1; i++) {
        var ox = i + fract((sin((ix+i)*127.1 + (iy+j)*311.7) * 43758.5453)) - fx;
        var oy = j + fract((sin((ix+i)*269.5 + (iy+j)*183.3) * 43758.5453)) - fy;
        var d = ox*ox + oy*oy;
        if(d < md) md = d;
      }
    }
    return sqrt(md);
  }
  function fract(x) { return x - floor(x); }

  /* cellnoise2 — integer-lattice hash noise (one random value per cell) */
  function cellnoise2(x, y) {
    var ix = floor(x), iy = floor(y);
    return fract(sin(ix * 127.1 + iy * 311.7) * 43758.5453);
  }

  function compile(src, paramNames){
    const stmts = src.split(";").map(s=>s.trim()).filter(Boolean);
    const body = [];
    for(let i=0;i<stmts.length-1;i++){
      const eq = stmts[i].indexOf("=");
      if(eq>0 && !/[=!<>]/.test(stmts[i][eq-1]) && stmts[i][eq+1]!=="="){
        body.push("var "+stmts[i]);
      } else {
        body.push(stmts[i]);
      }
    }
    body.push("return ("+stmts[stmts.length-1]+");");
    const args = ["x","y","t","noise2","sin","cos","sqrt","abs","atan2","PI",
                  "floor","ceil","min","max","pow","exp","log",
                  "clamp","smoothstep","fmod",
                  "tan","acos","round","turbulence2","voronoi2","cellnoise2","fract"].concat(paramNames);
    try {
      return new Function(...args, body.join("\n"));
    } catch(e){
      console.warn("Gizmo compile error:", e);
      return function(){ return 0; };
    }
  }

  /* --- Bootstrap each gizmo --- */
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  gizmos.forEach(p => {
    const id = p.cat.toLowerCase().replace("-","");
    const cv = document.getElementById(id + "c");
    if (!cv) return;
    cv.width = SIZE; cv.height = SIZE;
    const ctx2 = cv.getContext("2d");
    const img = ctx2.createImageData(SIZE, SIZE);
    const buf = img.data;

    const paramNames = p.params ? Object.keys(p.params) : [];
    let fn;
    try { fn = compile(p.do_pixel, paramNames); } catch(e){ return; }

    /* live param values */
    const paramValues = {};
    if (p.params) {
      for (const [k,v] of Object.entries(p.params)) paramValues[k] = v.value;
    }

    /* wire sliders */
    const panel = document.querySelector(`.gizmo-panel[data-gizmo="${id}"]`);
    if (panel) {
      panel.querySelectorAll("input[type=range]").forEach(inp => {
        const key = inp.dataset.param;
        const valSpan = inp.nextElementSibling;
        inp.addEventListener("input", () => {
          paramValues[key] = parseFloat(inp.value);
          if (valSpan) valSpan.textContent = parseFloat(inp.value).toFixed(2);
        });
      });
    }

    /* --- render loop (IntersectionObserver gated) --- */
    let running = false, t = 0;
    function render(){
      if (!running) return;
      const pArr = paramNames.map(k => paramValues[k]);
      for(let py=0; py<SIZE; py++){
        const ny = py / SIZE;
        for(let px=0; px<SIZE; px++){
          const nx = px / SIZE;
          let v = fn(nx, ny, t, noise2,
            sin, cos, sqrt, abs, atan2, PI,
            floor, ceil, min, max, pow, exp, log,
            clamp, smoothstep, fmod,
            tan, acos, round, turbulence2, voronoi2, cellnoise2, fract,
            ...pArr);
          v = clamp(v, 0, 1);
          const c = (v * 255) | 0;
          const i = (py * SIZE + px) * 4;
          buf[i] = c; buf[i+1] = c; buf[i+2] = c; buf[i+3] = 255;
        }
      }
      ctx2.putImageData(img, 0, 0);
      if (!reduced) t += 1;
      requestAnimationFrame(render);
    }

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting && !running) { running = true; render(); }
        else if (!e.isIntersecting) { running = false; }
      });
    }, { threshold: 0.05 });
    obs.observe(cv.parentElement);
  });
})();

/* ============================================================
   PATCH — the reader wiring one gizmo into another.
   Each patch post carries a source gizmo def and a chain spec;
   reader.js resolves the wire by type and ticks the graph.
   ============================================================ */
(function(){
  if (typeof Reader === "undefined") return;
  const SIZE = 256;
  const patches = POSTS.filter(p => p.type === "patch");
  if (!patches.length) return;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  patches.forEach(p => {
    const id = p.cat.toLowerCase().replace("-","");
    const cv = document.getElementById(id + "c");
    const wireRow = document.getElementById(id + "w");
    if (!cv) return;
    cv.width = SIZE; cv.height = SIZE;
    const ctx2 = cv.getContext("2d");
    const img = ctx2.createImageData(SIZE, SIZE);
    const buf = img.data;

    const target = POSTS.find(q => q.cat === p.chain.to);
    if (!target) { if (wireRow) wireRow.textContent = "no match: " + p.chain.to + " not in catalogue"; return; }

    const reader = Reader.createReader();
    try {
      reader.instantiate("src", p.def);
      reader.fromPost("dst", target);
      reader.connect("src", p.chain.fromPort, "dst", p.chain.toPort);
    } catch(e) {
      if (wireRow) wireRow.textContent = String(e.message || e);
      return;
    }

    /* sliders steer the source gizmo through the reader */
    const panel = document.querySelector(`.gizmo-panel[data-gizmo="${id}"]`);
    if (panel) {
      panel.querySelectorAll("input[type=range]").forEach(inp => {
        inp.addEventListener("input", () => {
          reader.setParam("src", inp.dataset.param, parseFloat(inp.value));
          const valSpan = inp.nextElementSibling;
          if (valSpan) valSpan.textContent = parseFloat(inp.value).toFixed(2);
        });
      });
    }

    let running = false, t = 0;
    function render(){
      if (!running) return;
      const field = reader.pull("dst", t);
      for(let py=0; py<SIZE; py++){
        const ny = py / SIZE;
        for(let px=0; px<SIZE; px++){
          let v = field(px / SIZE, ny);
          v = v<0?0:v>1?1:v;
          const c = (v * 255) | 0;
          const i = (py * SIZE + px) * 4;
          buf[i] = c; buf[i+1] = c; buf[i+2] = c; buf[i+3] = 255;
        }
      }
      ctx2.putImageData(img, 0, 0);
      if (!reduced) t += 1;
      requestAnimationFrame(render);
    }
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting && !running) { running = true; render(); }
        else if (!e.isIntersecting) { running = false; }
      });
    }, { threshold: 0.05 });
    obs.observe(cv.parentElement);
  });
})();
