    dna:{ author:"makers-factory", tags:["pattern","spiral","logarithmic","SDF","nautilus","animated"], why:"Logarithmic spiral SDF: the curve r = exp(b*theta) appears in nautilus shells and galaxies. Distance computed by unwrapping log-polar coordinates — residual from the spiral equation, wrapped to the nearest branch via floor(r/2pi+0.5)*2pi. The abs(wrapped)*r term converts angular residual to true distance. Mined from LYGIA sdf/ and IQ SDF patterns." } },
  { cat:"PP-069", date:"2026-08-15", type:"gizmo", title:"Mandala Fold", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) * zoom; a = atan2(dy, dx) + t * speed; seg = 6.28318 / slices; a = a - seg * floor(a / seg); a = (a > seg * 0.5) ? seg - a : a; r = abs(r - rings * floor(r / rings + 0.5)); 0.5 + 0.5 * sin(r * detail + a * detail)",
    params:{slices:{value:8,min:2,max:24},rings:{value:0.3,min:0.05,max:1},zoom:{value:3,min:0.5,max:15},detail:{value:20,min:5,max:60},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","mandala","symmetry","fold","polar","animated"], why:"Mandala through radial + angular domain folding. Kaleidoscope folds angle only — this also folds radius, creating concentric mirror bands that produce mandala-like concentric ring symmetry. The radial fold abs(r - period * round(r/period)) reflects the pattern at each ring boundary. Mined from Shadertoy radial domain folding techniques." } },
  { cat:"PP-06A", date:"2026-08-15", type:"gizmo", title:"Mandelbrot", tags:["Gizmo","Interactive"],
    do_pixel:"cx = (x - 0.5) * zoom + panx; cy = (y - 0.5) * zoom + pany; ax = 0.0; ay = 0.0; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; bx = ax*ax - ay*ay + cx; by = 2.0*ax*ay + cy; ax = bx*bx - by*by + cx; ay = 2.0*bx*by + cy; d = ax*ax + ay*ay; (d == d) ? smoothstep(escape, 0.0, d) : 0.0",
    params:{zoom:{value:3,min:0.1,max:10},panx:{value:-0.5,min:-2,max:2},pany:{value:0,min:-2,max:2},escape:{value:4,min:1,max:100}},
    dna:{ author:"makers-factory", tags:["fractal","mandelbrot","iteration","complex"], why:"The Mandelbrot set — 20 unrolled iterations of z^2+c. z0=0, c=(x,y). Magnitude after iteration mapped to brightness via smoothstep. The one fractal everyone recognises. NaN guard handles overflow from escaped orbits (inf-inf). Zoom in by decreasing zoom param, navigate with panx/pany." } },
  { cat:"PP-06B", date:"2026-08-15", type:"gizmo", title:"Marble Vein", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = turbulence2(px + t * drift, py, octaves, 2.0, 0.5); v = sin(py * freq + n * warp); 0.5 + 0.5 * v",
    params:{scale:{value:4,min:0.5,max:20},freq:{value:6,min:1,max:30},warp:{value:4,min:0,max:16},octaves:{value:4,min:1,max:8},drift:{value:0.01,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["noise","marble","texture","organic","animated"], why:"Marble veining: sin(coord + noise * amplitude) wraps noise into directional bands. From Book of Shaders ch.13 fBm applications — the canonical procedural marble. Freq controls vein density, warp controls how much noise distorts the straight bands." } },
  { cat:"PP-06C", date:"2026-08-15", type:"gizmo", title:"Meander", tags:["Gizmo","Interactive"],
    do_pixel:"wave = sin(x * freq + t * speed) * amp + sin(x * freq * 2.0 + t * speed * 1.3) * amp * 0.5; d = abs(y - 0.5 - wave); clamp(1.0 - d / thick, 0.0, 1.0)",
    params:{freq:{value:12,min:2,max:40},amp:{value:0.15,min:0.01,max:0.4},thick:{value:0.03,min:0.005,max:0.15},speed:{value:0.05,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","wave","sine","river","line","animated"], why:"Two-harmonic sine wave as a distance-field line. The second harmonic at half amplitude gives it the asymmetric meander shape — rivers, Art Nouveau borders, EKG traces. Freq and amp set the character; thick sets the stroke." } },
  { cat:"PP-06D", date:"2026-08-15", type:"gizmo", title:"Mirror Fold", tags:["Gizmo","Interactive"],
    do_pixel:"fx = x * repeats; fy = y * repeats; mx = abs(fx - floor(fx * 0.5 + 0.5) * 2.0); my = abs(fy - floor(fy * 0.5 + 0.5) * 2.0); 0.5 + 0.5 * sin(mx * 6.28318 * detail + t * speed) * cos(my * 6.28318 * detail)",
    params:{repeats:{value:4,min:1,max:12},detail:{value:2,min:0.5,max:10},speed:{value:0.3,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","mirror","fold","symmetry","tile","animated"], why:"Triangle-wave coordinate fold: abs(x - round(x/2)*2) creates a zigzag ramp that mirrors at every integer boundary. Applied to both axes, it tiles a pattern with seamless reflections — every other repeat is flipped, eliminating seams. The folded coordinates drive a sin*cos pattern. Mined from LYGIA space/ mirror-fold and domain repetition techniques." } },
  { cat:"PP-06E", date:"2026-08-15", type:"gizmo", title:"Mobius Warp", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; cx = radius * cos(t * speed); cy = radius * sin(t * speed); dr = 1.0 - strength * (cx * px - cy * py); di = 0.0 - strength * (cx * py + cy * px); den = dr * dr + di * di + 0.0001; nx = (px * dr + py * di) / den; ny = (py * dr - px * di) / den; 0.5 + 0.5 * noise2(nx * scale, ny * scale)",
    params:{scale:{value:4,min:0.5,max:20},strength:{value:2,min:0,max:8},radius:{value:0.3,min:0,max:0.5},speed:{value:0.15,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["warp","mobius","conformal","complex","inversion","animated"], why:"Mobius transform f(z) = z / (1 - strength*c*z) applied as domain warp. A conformal (angle-preserving) map that produces fish-eye, circular inversions, and swirling distortions. The pole orbits the center creating animated warping. Mined from Shadertoy conformal mapping techniques and Nathan Reed's conformal texture mapping article." } },
  { cat:"PP-06F", date:"2026-08-15", type:"gizmo", title:"Noise Bands", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale + t * drift; n = turbulence2(px, py, 4, 2.0, 0.5); floor(n * bands + 0.5) / bands",
    params:{scale:{value:3,min:0.5,max:15},bands:{value:6,min:2,max:20},drift:{value:0.01,min:0,max:0.3}},
    dna:{ author:"makers-factory", tags:["noise","quantize","bands","posterize"], why:"Quantized turbulence — floor(n*bands)/bands — from the t06_044 contour-banding taste and st_034 marching-squares idea. Continuous noise becomes a topographic map. Bands dial = how many altitude lines." } },
  { cat:"PP-070", date:"2026-08-15", type:"gizmo", title:"Noise Contour", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = turbulence2(px, py, 5, 2.0, 0.5); clamp(0.5 + 0.5 * cos(n * rings * 6.28318 + t * drift), 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},rings:{value:8,min:1,max:30},drift:{value:0.02,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["noise","contour","rings","topographic"], why:"cos(noise * freq) wraps the noise field into concentric contour rings. From t06_044 contour-banding core. NoiseBands quantizes; this one oscillates — same terrain, different cartography." } },
  { cat:"PP-071", date:"2026-08-15", type:"gizmo", title:"Noise Edge", tags:["Gizmo","Interactive"],
    do_pixel:"n = noise2(x * scale + t * drift, y * scale); smoothstep(threshold - edge_width, threshold + edge_width, n)",
    params:{scale:{value:4,min:0.5,max:20},threshold:{value:0.5,min:0,max:1},edge_width:{value:0.02,min:0.001,max:0.2},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","threshold","edge","coastline","animated"], why:"Noise field through a step function, creating hard boundaries like coastlines. The gate makes the diagram. st_010 the gate." } },
  { cat:"PP-072", date:"2026-08-15", type:"gizmo", title:"Noise Mask", tags:["Gizmo","Interactive"],
    do_pixel:"n1 = 0.5 + 0.5 * noise2(x * scale1 + t * drift, y * scale1); n2 = 0.5 + 0.5 * noise2(x * scale2 + 7.3 + t * drift * 0.6, y * scale2 + 3.7); n1 * n2",
    params:{scale1:{value:3,min:0.5,max:20},scale2:{value:8,min:0.5,max:20},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","mask","multiply","blend","animated"], why:"Two noise fields multiplied together, one as source one as mask. st_005/006 noise stack, multiply blend." } },
  { cat:"PP-073", date:"2026-08-15", type:"gizmo", title:"Noise Swirl", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); sa = a + r * twist + t * speed; nx = r * cos(sa) * scale; ny = r * sin(sa) * scale; turbulence2(nx, ny, octaves, 2.0, 0.5)",
    params:{scale:{value:4,min:0.5,max:20},twist:{value:6,min:0,max:20},octaves:{value:3,min:1,max:8},speed:{value:0.3,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["noise","spiral","swirl","polar","animated"], why:"Spiral-warped noise: maps to polar coordinates then twists angle proportional to radius before noise lookup. Creates vortex and galaxy-like patterns from plain turbulence. The twist parameter controls spiral tightness — at 0 it is radial, at high values it is a whirlpool." } },
  { cat:"PP-074", date:"2026-08-15", type:"gizmo", title:"Octagon", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); d1 = min(-0.923880 * px + 0.382683 * py, 0.0); px = px + 2.0 * d1 * 0.923880; py = py - 2.0 * d1 * 0.382683; d2 = min(0.923880 * px + 0.382683 * py, 0.0); px = px - 2.0 * d2 * 0.923880; py = py - 2.0 * d2 * 0.382683; px = px - clamp(px, -0.414214 * radius, 0.414214 * radius); py = py - radius; d = sqrt(px * px + py * py) * (py > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","octagon","polygon"], why:"Inigo Quilez 2D SDF — regular octagon via double reflection folding. Two reflections encode cos(45) and sin(45), reducing the shape to one sector. The stop sign. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-075", date:"2026-08-15", type:"gizmo", title:"Onion Rings", tags:["Gizmo","Interactive"],
    do_pixel:"dx = (x - 0.5) * scale; dy = (y - 0.5) * scale; r = sqrt(dx * dx + dy * dy); sp = max(spacing, 0.01); shell = abs(r - floor(r / sp + 0.5) * sp) - thickness; smoothstep(blur, 0.0, 0.0 - shell)",
    params:{scale:{value:3,min:1,max:10},spacing:{value:0.5,min:0.1,max:2},thickness:{value:0.05,min:0.01,max:0.2},blur:{value:0.03,min:0.005,max:0.1}},
    dna:{ author:"makers-factory", tags:["pattern","concentric","shells","SDF","rings"], why:"SDF shell outlines: takes a radial distance and creates infinite concentric shells via modular arithmetic — abs(d - round(d/spacing)*spacing) finds distance to the nearest shell boundary, subtracting thickness carves the ring width. The smoothstep anti-aliasing gives clean edges. A fundamental SDF operation: any distance field can be 'onioned'. Mined from LYGIA sdf/ onion operation and IQ SDF techniques." } },
  { cat:"PP-076", date:"2026-08-15", type:"gizmo", title:"Op Art Wave", tags:["Gizmo","Interactive"],
    do_pixel:"w = sin(x * freq + amp * sin(y * mod_freq + t * speed)); smoothstep(0.0 - edge, edge, w)",
    params:{freq:{value:30,min:5,max:100},mod_freq:{value:4,min:1,max:20},amp:{value:2,min:0,max:10},edge:{value:0.05,min:0.01,max:0.5},speed:{value:0.3,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["pattern","op-art","stripes","wave","illusion","animated"], why:"Bridget Riley op-art: vertical stripes whose phase is modulated by a perpendicular sine wave. The frequency modulation creates an illusion of 3D undulation on a flat surface. Mined from Shadertoy op-art pattern studies. The smoothstep threshold gives hard black/white — the edge param walks it from sharp to soft." } },
  { cat:"PP-077", date:"2026-08-15", type:"gizmo", title:"Orbital Dots", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; val = 0.0; i = 1.0; r_orb = i / (orbits + 1.0); j = 0.0; j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); i = 2.0; r_orb = i / (orbits + 1.0); j = 0.0; j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); i = 3.0; r_orb = i / (orbits + 1.0); j = 0.0; j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); j = j + 1.0; a = j * 6.28318 / dots_per_orbit + t * speed * i; ox = cos(a) * r_orb; oy = sin(a) * r_orb; dd = sqrt((px - ox) * (px - ox) + (py - oy) * (py - oy)); val = val + smoothstep(dot_size, dot_size * 0.5, dd); clamp(val, 0.0, 1.0)",
    params:{orbits:{value:5,min:1,max:10},dots_per_orbit:{value:8,min:3,max:20},dot_size:{value:0.02,min:0.005,max:0.1},speed:{value:0.02,min:0,max:0.3}},
    dna:{ author:"makers-factory", tags:["pattern","orbital","dots","concentric","animated"], why:"Dots arranged on multiple concentric orbits with staggered phase. t06 orbital patterns." } },
  { cat:"PP-078", date:"2026-08-15", type:"gizmo", title:"Oriented Box", tags:["Gizmo","Interactive"],
    do_pixel:"ca = cos(angle); sa = sin(angle); qx = ca * (x - 0.5) + sa * (y - 0.5); qy = -sa * (x - 0.5) + ca * (y - 0.5); qx = abs(qx) - box_len; qy = abs(qy) - box_w * 0.5; mx = max(qx, 0.0); my = max(qy, 0.0); d = sqrt(mx * mx + my * my) + min(max(qx, qy), 0.0); smoothstep(blur, 0.0, d)",
    params:{angle:{value:0.5,min:0,max:3.14},box_len:{value:0.15,min:0.03,max:0.4},box_w:{value:0.06,min:0.02,max:0.3},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","box","rectangle","rotated"], why:"Inigo Quilez 2D SDF — oriented box (rotated rectangle). A 2D rotation matrix aligns the coordinate system to the box's angle, then standard box SDF. Any rectangle at any angle — the selection marquee, the progress bar, the building footprint. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-079", date:"2026-08-15", type:"gizmo", title:"Oriented Vesica", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; vx = 2.0 * cos(angle); vy = 2.0 * sin(angle); rx = vy * px - vx * py; ry = vx * px + vy * py; qx = 0.5 * abs(rx); qy = 0.5 * abs(ry); dv = 0.5 * (vlen * vlen - vw * vw) / vw; cnd = vlen * qx < dv * (qy - vlen) ? 1.0 : 0.0; hx = cnd > 0.5 ? 0.0 : -dv; hy = cnd > 0.5 ? vlen : 0.0; hz = cnd > 0.5 ? 0.0 : dv + vw; ex = qx - hx; ey = qy - hy; d = sqrt(ex * ex + ey * ey) - hz; smoothstep(blur, 0.0, d)",
    params:{angle:{value:0.5,min:0,max:3.14159},vlen:{value:0.15,min:0.05,max:0.4},vw:{value:0.08,min:0.02,max:0.25},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","vesica","oriented","lens"], why:"Inigo Quilez 2D SDF — oriented vesica piscis. The regular Vesica is axis-aligned; this variant takes an angle parameter to rotate the lens shape freely. Uses a 2x2 rotation matrix to align the local frame. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07A", date:"2026-08-15", type:"gizmo", title:"Parabola", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; ik = 1.0 / curv; pp = ik * (py - 0.5 * ik) / 3.0; qq = 0.25 * ik * ik * px; hh = qq * qq - pp * pp * pp; sh = sqrt(max(hh, 0.0)); rarg = qq + sh; sgn_r = rarg > 0.0 ? 1.0 : -1.0; r1 = sgn_r * pow(max(abs(rarg), 0.000000001), 0.333333333); x1 = r1 + (abs(r1) > 0.0001 ? pp / r1 : 0.0); r2 = sqrt(max(pp, 0.000000001)); pr = pp * r2; aarg = clamp(qq / (abs(pr) > 0.000000001 ? pr : 0.000000001), -1.0, 1.0); x2 = 2.0 * r2 * cos(acos(aarg) / 3.0); xf = hh > 0.0 ? x1 : x2; dx = px - xf; dy = py - curv * xf * xf; sgn = px > xf ? 1.0 : -1.0; d = sqrt(dx * dx + dy * dy) * sgn; smoothstep(blur, 0.0, d)",
    params:{curv:{value:2,min:0.5,max:8},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","parabola","curve","quadratic"], why:"Inigo Quilez 2D SDF — infinite parabola y = k*x^2. The closest point on a parabola requires solving a depressed cubic via Cardano's formula (h>0 branch) or the trigonometric method (h<=0 branch). Uses acos and cube root. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07B", date:"2026-08-15", type:"gizmo", title:"Parabola Segment", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; ik = pw * pw / ph; pp = ik * (ph - py - 0.5 * ik) / 3.0; qq = px * ik * ik / 4.0; hh = qq * qq - pp * pp * pp; sh = sqrt(max(hh, 0.0)); rarg = qq + sh; sgn_r = rarg > 0.0 ? 1.0 : -1.0; r1 = sgn_r * pow(max(abs(rarg), 0.000000001), 0.333333333); x1 = r1 + (abs(r1) > 0.0001 ? pp / r1 : 0.0); r2 = sqrt(max(pp, 0.000000001)); pr = pp * r2; aarg = clamp(qq / (abs(pr) > 0.000000001 ? pr : 0.000000001), -1.0, 1.0); x2 = 2.0 * r2 * cos(acos(aarg) / 3.0); xf = hh > 0.0 ? x1 : x2; xf = min(xf, pw); dx = px - xf; dy = py - ph + xf * xf / ik; sgn = ik * (py - ph) + px * px > 0.0 ? 1.0 : -1.0; d = sqrt(dx * dx + dy * dy) * sgn; smoothstep(blur, 0.0, d)",
    params:{pw:{value:0.2,min:0.05,max:0.4},ph:{value:0.15,min:0.05,max:0.4},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","parabola","segment","arch"], why:"Inigo Quilez 2D SDF — bounded parabolic segment. Unlike the infinite Parabola, this clips to a finite width pw and height ph. Same depressed-cubic solver (Cardano + trig fallback) with an extra min(x, pw) clamp. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07C", date:"2026-08-15", type:"gizmo", title:"Parallelogram", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; npx = py < 0.0 ? -px : px; npy = py < 0.0 ? -py : py; wx = npx - skew; wy = npy - height; wx = wx - clamp(wx, -width, width); dww = wx * wx + wy * wy; dwy = -wy; ss = npx * height - npy * skew; spx = ss < 0.0 ? -npx : npx; spy = ss < 0.0 ? -npy : npy; vx = spx - width; vy = spy; dot_ve = vx * skew + vy * height; dot_ee = skew * skew + height * height + 0.0001; tt = clamp(dot_ve / dot_ee, -1.0, 1.0); vx = vx - skew * tt; vy = vy - height * tt; dvv = vx * vx + vy * vy; dv2 = width * height - abs(ss); finx = min(dww, dvv); finy = min(dwy, dv2); d = sqrt(finx) * (-finy > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{width:{value:0.2,min:0.03,max:0.4},height:{value:0.15,min:0.03,max:0.3},skew:{value:0.08,min:0,max:0.3},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","parallelogram","skewed","quad"], why:"Inigo Quilez 2D SDF — parallelogram. A rectangle sheared by a skew offset. Width controls the horizontal extent, height the vertical, skew tilts the sides. The italic letter, the leaning wall, the wind-pushed flag. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07D", date:"2026-08-15", type:"gizmo", title:"Pentagon", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; d1 = min(-0.809017 * px + 0.587785 * py, 0.0); px = px + 2.0 * d1 * 0.809017; py = py - 2.0 * d1 * 0.587785; d2 = min(0.809017 * px + 0.587785 * py, 0.0); px = px - 2.0 * d2 * 0.809017; py = py - 2.0 * d2 * 0.587785; px = px - clamp(px, -radius * 0.726543, radius * 0.726543); py = py - radius; d = sqrt(px * px + py * py) * (py > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","pentagon","polygon"], why:"Inigo Quilez 2D SDF — regular pentagon via double reflection folding. Two reflections reduce the full pentagon to a single sector, then distance to the nearest edge. The constants encode cos(72) and sin(72). Five-fold symmetry — the shape that can't tile. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07E", date:"2026-08-15", type:"gizmo", title:"Pentagram", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; d1 = max(0.809017 * px - 0.587785 * py, 0.0); px = px - 2.0 * d1 * 0.809017; py = py + 2.0 * d1 * 0.587785; d2 = max(-0.809017 * px - 0.587785 * py, 0.0); px = px + 2.0 * d2 * 0.809017; py = py + 2.0 * d2 * 0.587785; px = abs(px); py = py - radius; dp = px * 0.309017 + py * (-0.951057); tc = clamp(dp, 0.0, 0.726543 * radius); qx = px - 0.309017 * tc; qy = py + 0.951057 * tc; sg = 0.309017 * py + 0.951057 * px; d = sqrt(qx * qx + qy * qy) * (sg > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.45},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","pentagram","star","five-pointed"], why:"Inigo Quilez 2D SDF — pentagram (five-pointed star). Uses max-reflections (outward folding) rather than min-reflections (inward folding) to create the concave star shape. The star that can be drawn in one stroke. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-07F", date:"2026-08-15", type:"gizmo", title:"Phase Field", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = noise2(px, py); wave = 0.5 + 0.5 * sin(t * speed - n * phase); mask = clamp(-n * edge, 0.0, 1.0); clamp(wave * mask, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},phase:{value:8,min:1,max:30},edge:{value:5,min:1,max:20},speed:{value:0.1,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["noise","phase","silhouette","organic","animated"], why:"The jellyfish chassis from t06_176 — one noise field, two jobs. The field defines the SHAPE (negative regions are visible, positive regions are invisible) and the PHASE (each point oscillates at its own noise-derived time). The silhouette pulses like a breathing creature." } },
  { cat:"PP-080", date:"2026-08-15", type:"gizmo", title:"Pie", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; sx = sin(angle * 0.5); cy = cos(angle * 0.5); l = sqrt(px * px + py * py) - radius; dp = px * sx + py * cy; cp = clamp(dp, 0.0, radius); mx = px - sx * cp; my = py - cy * cp; m = sqrt(mx * mx + my * my); sg = cy * px - sx * py; d = max(l, m * (sg > 0.0 ? 1.0 : -1.0)); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.3,min:0.05,max:0.48},angle:{value:2.5,min:0.2,max:6.28},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","pie","sector","wedge"], why:"Inigo Quilez 2D SDF — circular sector (pie slice). Angle controls the opening in radians: pi/2 is a quarter, pi is a half, 2*pi is a full circle. The sector is symmetric about the vertical axis via abs(x). Useful for progress indicators, dial faces, and any radial mask. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-081", date:"2026-08-15", type:"gizmo", title:"Pinwheel", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; a = atan2(dy, dx) + t * speed; v = 0.5 + 0.5 * sin(a * blades); pow(v, sharpness)",
    params:{blades:{value:6,min:2,max:24},sharpness:{value:5,min:0.5,max:20},speed:{value:0.05,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","pinwheel","rotation","angular","animated"], why:"Rotating pinwheel/windmill pattern. Rotational patterns." } },
  { cat:"PP-082", date:"2026-08-15", type:"gizmo", title:"Planet Noise", tags:["Gizmo","Interactive"],
    do_pixel:"cx = x - 0.5; cy = y - 0.5; r = sqrt(cx * cx + cy * cy); mask = r < 0.49 ? 1.0 : 0.0; sz = sqrt(max(0.25 - r * r, 0.0)) * 2.0; rx = cx * 2.0 * cos(t * drift) - sz * sin(t * drift); n = turbulence2(rx * scale, cy * 2.0 * scale, 4, 2.0, 0.5); land = n > sealevel ? 1.0 : 0.4; clamp(land * sz * mask, 0.0, 1.0)",
    params:{scale:{value:4,min:1,max:15},sealevel:{value:0.45,min:0.1,max:0.8},drift:{value:0.005,min:0,max:0.05}},
    dna:{ author:"makers-factory", tags:["noise","sphere","planet","terrain","animated"], why:"Spherical noise projection with sea-level clamp from t06_159 plate-tectonics taste. Noise sampled on a hemisphere surface, rotated for continental drift. The clamp IS the coastline — below sealevel is ocean (dark), above is land (bright). Limb darkening from the sphere z-coordinate." } },
  { cat:"PP-083", date:"2026-08-15", type:"gizmo", title:"Polar Rose", tags:["Gizmo","Interactive"],
    do_pixel:"cx = x - 0.5; cy = y - 0.5; a = atan2(cy, cx) + t * spin; dd = sqrt(cx * cx + cy * cy); r = size * abs(cos(petals * a)); clamp(1.0 - abs(dd - r) / thick, 0.0, 1.0)",
    params:{petals:{value:5,min:2,max:12},size:{value:0.3,min:0.05,max:0.45},thick:{value:0.02,min:0.005,max:0.1},spin:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","polar","rose","flower","radial","animated"], why:"Polar rose curve — r = cos(n*theta). From the curve-stitching / envelope family vocabulary (t06 batch 07). Even petals = 2n lobes, odd = n lobes." } },
  { cat:"PP-084", date:"2026-08-15", type:"gizmo", title:"Polar Vortex", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); spiral = a * arms + r * twist * 6.28318 + t * speed; nz = noise2(x * 3.0 + t * 0.01, y * 3.0) * noise_amount * 6.28318; 0.5 + 0.5 * sin(spiral + nz)",
    params:{arms:{value:5,min:1,max:16},twist:{value:3,min:0.5,max:20},noise_amount:{value:0.3,min:0,max:2},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","polar","spiral","vortex","noise","animated"], why:"Spiral arms in polar coordinates with noise perturbation. From t06 polar_vortex_disorder." } },
  { cat:"PP-085", date:"2026-08-15", type:"gizmo", title:"Poly SDF", tags:["Gizmo","Interactive"],
    do_pixel:"dx = (x - 0.5) * scale; dy = (y - 0.5) * scale; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); seg = 6.28318 / max(sides, 3.0); a = a - seg * floor(a / seg + 0.5); a = abs(a); edge = r * cos(a) - size * cos(seg * 0.5); smoothstep(blur, 0.0, 0.0 - edge)",
    params:{sides:{value:6,min:3,max:12},size:{value:0.35,min:0.1,max:0.5},scale:{value:1,min:0.5,max:4},blur:{value:0.02,min:0.005,max:0.1}},
    dna:{ author:"makers-factory", tags:["SDF","polygon","regular","shape","parameterized"], why:"Generalized N-gon SDF: the angle is folded into one sector (2pi/N width), then the distance to the polygon's flat edge is r*cos(a) - R*cos(pi/N). The sector fold uses round-to-nearest: floor(a/seg+0.5)*seg. Unlike the fixed Pentagon/Hexagon/Octagon gizmos, sides is a continuous parameter — fractional values produce interpolated shapes. Mined from LYGIA sdf/polySDF and IQ's polygon distance field." } },
  { cat:"PP-086", date:"2026-08-15", type:"gizmo", title:"Pulse Lamp", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = noise2(px, py); v = pow(sin(t * speed + n * 6.28318), 2.0); lamp = clamp(width / max(abs(n), 0.001), 0.0, 1.0); clamp(v * lamp, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},width:{value:0.1,min:0.01,max:0.5},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["noise","glow","singularity","bioluminescent","animated"], why:"Travelling luminance from t06_186 dragonfly taste — the singularity IS the lamp. Where noise crosses zero, 1/abs(n) spikes to infinity, clamped to a glow band. sin^2(t + n*TAU) modulates the pulse as it travels along the noise zero-crossings. Division-by-zero as a highlighter." } },
  { cat:"PP-087", date:"2026-08-15", type:"gizmo", title:"Quadratic Circle", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5) / qscale; py = abs(y - 0.5) / qscale; sw = py > px ? 1.0 : 0.0; tx = sw > 0.5 ? py : px; ty = sw > 0.5 ? px : py; aa = tx - ty; bb = tx + ty; cc = (2.0 * bb - 1.0) / 3.0; hh = aa * aa + cc * cc * cc; sh = sqrt(max(abs(hh), 0.0)); hma = abs(sh - aa); cb1 = (sh > aa ? 1.0 : -1.0) * pow(max(hma, 0.000000001), 0.333333333); cb2 = pow(max(sh + aa, 0.000000001), 0.333333333); t1 = cb1 - cb2; rz = sqrt(max(-cc, 0.000000001)); vc = cc * rz; aarg = clamp(aa / (abs(vc) > 0.000000001 ? vc : 0.000000001), -1.0, 1.0); vv = acos(aarg) / 3.0; t2 = -rz * (cos(vv) + sin(vv) * 1.732050808); tt = (hh > 0.0 ? t1 : t2) * 0.5; wx = -tt + 0.75 - tt * tt - tx; wy = tt + 0.75 - tt * tt - ty; d = sqrt(wx * wx + wy * wy) * (aa * aa * 0.5 + bb - 1.5 > 0.0 ? 1.0 : -1.0) * qscale; smoothstep(blur, 0.0, d)",
    params:{qscale:{value:0.3,min:0.1,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","quadratic-circle","squircle"], why:"Inigo Quilez 2D SDF — quadratic circle (|x|+|y|=1 smoothed to x^2+y^2=1 at the axes). A squircle-family shape where the boundary interpolates between a diamond and a circle. Solves a depressed cubic for the nearest point. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-088", date:"2026-08-15", type:"gizmo", title:"Radial Bands", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - center_x; dy = y - center_y; d = sqrt(dx * dx + dy * dy); scaled = d * bands * 2.0; band_pos = scaled - floor(scaled); smoothstep(edge_width, 0.0, band_pos) * smoothstep(edge_width, 0.0, 1.0 - band_pos)",
    params:{bands:{value:8,min:1,max:40},center_x:{value:0.5,min:0,max:1},center_y:{value:0.5,min:0,max:1},edge_width:{value:0.02,min:0.001,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","radial","bands","smoothstep","target"], why:"Distance from centre quantised into bands with smoothstep edges. From st_010 step/smoothstep in taste_07." } },
  { cat:"PP-089", date:"2026-08-15", type:"gizmo", title:"Relief Map", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; eps = 0.005; n0 = turbulence2(px, py, 5, 2.0, 0.5); nx = turbulence2(px + eps, py, 5, 2.0, 0.5); ny = turbulence2(px, py + eps, 5, 2.0, 0.5); dx2 = (nx - n0) / eps; dy2 = (ny - n0) / eps; light = dx2 * cos(angle) + dy2 * sin(angle); clamp(0.5 + light * depth, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},angle:{value:0.785,min:0,max:6.28318},depth:{value:0.15,min:0.01,max:1}},
    dna:{ author:"makers-factory", tags:["noise","relief","emboss","lighting","terrain"], why:"Directional derivative of turbulence along a light vector — the classic emboss/relief shading. Gradient dot light-direction gives hillshade. Angle rotates the sun. Depth dials the contrast from flat map to dramatic terrain." } },
  { cat:"PP-08A", date:"2026-08-15", type:"gizmo", title:"Rhombus", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); ndot = width * width - height * height - 2.0 * px * width + 2.0 * py * height; denom = width * width + height * height; h = clamp(ndot / denom, -1.0, 1.0); ex = px - 0.5 * width * (1.0 - h); ey = py - 0.5 * height * (1.0 + h); d = sqrt(ex * ex + ey * ey) * ((px * height + py * width - width * height) > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{width:{value:0.25,min:0.05,max:0.48},height:{value:0.35,min:0.05,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","rhombus","diamond"], why:"Inigo Quilez 2D SDF — rhombus (diamond). Width and height control the half-extents independently, giving any aspect ratio from a wide kite to a tall lozenge. The ndot trick (a.x*b.x - a.y*b.y) finds the nearest point on the edge without explicit line intersection. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-08B", date:"2026-08-15", type:"gizmo", title:"Ridge Noise", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; amp = 1.0; freq_mult = 1.0; total = 0.0; weight = 1.0; n1 = noise2(px * freq_mult, py * freq_mult); r1 = 1.0 - abs(n1 * 2.0 - 1.0); r1 = r1 * r1 * weight; total = total + r1 * amp; weight = clamp(r1 * 2.0, 0.0, 1.0); amp = amp * 0.5; freq_mult = freq_mult * 2.0; n2 = noise2(px * freq_mult, py * freq_mult); r2 = 1.0 - abs(n2 * 2.0 - 1.0); r2 = r2 * r2 * weight; total = total + r2 * amp; weight = clamp(r2 * 2.0, 0.0, 1.0); amp = amp * 0.5; freq_mult = freq_mult * 2.0; n3 = noise2(px * freq_mult, py * freq_mult); r3 = 1.0 - abs(n3 * 2.0 - 1.0); r3 = r3 * r3 * weight; total = total + r3 * amp; weight = clamp(r3 * 2.0, 0.0, 1.0); amp = amp * 0.5; freq_mult = freq_mult * 2.0; n4 = noise2(px * freq_mult, py * freq_mult); r4 = 1.0 - abs(n4 * 2.0 - 1.0); r4 = r4 * r4 * weight; total = total + r4 * amp; weight = clamp(r4 * 2.0, 0.0, 1.0); amp = amp * 0.5; freq_mult = freq_mult * 2.0; n5 = noise2(px * freq_mult, py * freq_mult); r5 = 1.0 - abs(n5 * 2.0 - 1.0); r5 = r5 * r5 * weight; total = total + r5 * amp; clamp(total, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:20},octaves:{value:5,min:1,max:8},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","ridge","mountains","terrain","animated"], why:"Ridge noise: 1 - abs(noise*2-1) squared, sharp peaks smooth valleys. Mountains. From st_004 ridge variant in taste_07." } },
  { cat:"PP-08C", date:"2026-08-15", type:"gizmo", title:"Ring Sector", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; nx = sin(opening); ny = cos(opening); rx = nx * px - ny * py; ry = ny * px + nx * py; l = sqrt(rx * rx + ry * ry); d1 = abs(l - radius) - thick * 0.5; inner = max(0.0, abs(radius - ry) - thick * 0.5); d2 = sqrt(rx * rx + inner * inner) * (rx > 0.0 ? 1.0 : -1.0); d = max(d1, d2); smoothstep(blur, 0.0, d)",
    params:{opening:{value:0.5,min:0.1,max:2.5},radius:{value:0.2,min:0.05,max:0.4},thick:{value:0.04,min:0.01,max:0.15},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","ring","annulus","sector"], why:"Inigo Quilez 2D SDF — ring sector with flat caps. Unlike Arc (which has round caps), this ring has squared-off ends at the opening. Opening controls the gap angle (small = nearly full ring, large = thin sliver), radius sets the curve, thick inflates the centreline. A dial indicator, a loading spinner, a gauge mark. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-08D", date:"2026-08-15", type:"gizmo", title:"Ripple Pool", tags:["Gizmo","Interactive"],
    do_pixel:"val = 0.0; sx = cellnoise2(1.0, 0.5) * 0.8 + 0.1; sy = cellnoise2(0.5, 1.0) * 0.8 + 0.1; d = sqrt((x - sx) * (x - sx) + (y - sy) * (y - sy)); val = val + sin(d * frequency - t * speed) / (1.0 + d * decay); sx = cellnoise2(2.0, 1.5) * 0.8 + 0.1; sy = cellnoise2(1.5, 2.0) * 0.8 + 0.1; d = sqrt((x - sx) * (x - sx) + (y - sy) * (y - sy)); val = val + sin(d * frequency - t * speed * 1.1) / (1.0 + d * decay); sx = cellnoise2(3.0, 2.5) * 0.8 + 0.1; sy = cellnoise2(2.5, 3.0) * 0.8 + 0.1; d = sqrt((x - sx) * (x - sx) + (y - sy) * (y - sy)); val = val + sin(d * frequency - t * speed * 0.9) / (1.0 + d * decay); 0.5 + val / (sources * 0.5)",
    params:{sources:{value:3,min:1,max:6},frequency:{value:25,min:5,max:100},decay:{value:3,min:0.5,max:15},speed:{value:0.1,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","ripple","wave","water","animated"], why:"Multiple circular ripples from random points with distance decay. Water ripple patterns." } },
  { cat:"PP-08E", date:"2026-08-15", type:"gizmo", title:"Round Box", tags:["Gizmo","Interactive"],
    do_pixel:"qx = abs(x - 0.5) - width + rounding; qy = abs(y - 0.5) - height + rounding; mx = (qx > 0 ? qx : 0); my = (qy > 0 ? qy : 0); d = min(max(qx, qy), 0.0) + sqrt(mx * mx + my * my) - rounding; smoothstep(blur, 0.0, d)",
    params:{width:{value:0.3,min:0.02,max:0.48},height:{value:0.2,min:0.02,max:0.48},rounding:{value:0.05,min:0,max:0.2},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","box","rectangle","rounded"], why:"Inigo Quilez 2D SDF — rounded rectangle distance field. The fundamental panel/frame/badge building block. Rounding=0 recovers a sharp box. The distance field means blur controls edge softness exactly. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-08F", date:"2026-08-15", type:"gizmo", title:"Rounded Cross", tags:["Gizmo","Interactive"],
    do_pixel:"sx = abs(x - 0.5) / scale; sy = abs(y - 0.5) / scale; k = 0.5 * (shape + 1.0 / shape); dx1 = sx - 1.0; dy1 = sy - k; d1 = k - sqrt(dx1 * dx1 + dy1 * dy1); dx2a = sx; dy2a = sy - shape; dx2b = sx - 1.0; dy2b = sy; dq1 = dx2a * dx2a + dy2a * dy2a; dq2 = dx2b * dx2b + dy2b * dy2b; d2 = sqrt(min(dq1, dq2)); d = (sx < 1.0 && sy < sx * (k - shape) + shape) ? d1 : d2; d = d * scale; smoothstep(blur, 0.0, d)",
    params:{scale:{value:0.2,min:0.05,max:0.4},shape:{value:0.5,min:0.1,max:1.5},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","cross","rounded"], why:"Inigo Quilez 2D SDF — rounded cross. A plus sign with smooth circular elbows where the arms meet. Scale sets overall size, shape controls arm width vs length ratio (shape=1 gives square arms, shape<1 gives thin arms). The shape parameter also determines the elbow curvature. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-090", date:"2026-08-15", type:"gizmo", title:"Rounded X", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); s = min(px + py, width) * 0.5; d = sqrt((px - s) * (px - s) + (py - s) * (py - s)) - radius; smoothstep(blur, 0.0, d)",
    params:{width:{value:0.35,min:0.1,max:0.6},radius:{value:0.06,min:0.005,max:0.15},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","cross","rounded"], why:"Inigo Quilez 2D SDF — X shape with rounded ends. The skeleton is the two diagonals y=x and y=-x, capped at width. Radius inflates the skeleton into a solid tube. Three statements, no conditionals, no trig — one of the cleanest SDF primitives. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-091", date:"2026-08-15", type:"gizmo", title:"Scaffold", tags:["Gizmo","Interactive"],
    do_pixel:"gx = x * cells; gy = y * cells; fx = gx - floor(gx); fy = gy - floor(gy); hline = abs(fy - 0.5); vline = abs(fx - 0.5); d1 = abs(fx + fy - 1.0) * 0.7071; d2 = abs(fx - fy) * 0.7071; grid = min(min(hline, vline), min(d1, d2)); clamp(1.0 - grid / thick, 0.0, 1.0)",
    params:{cells:{value:6,min:2,max:20},thick:{value:0.06,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","grid","scaffold","structural","geometric"], why:"Cross-braced grid — horizontal, vertical, and both diagonals. The structural skeleton that engineering drawings and truss bridges share. Thickness controls whether it reads as wireframe or lattice." } },
  { cat:"PP-092", date:"2026-08-15", type:"gizmo", title:"Segment", tags:["Gizmo","Interactive"],
    do_pixel:"ax = 0.5 - seg_len * cos(angle); ay = 0.5 - seg_len * sin(angle); bx = 0.5 + seg_len * cos(angle); by = 0.5 + seg_len * sin(angle); pax = x - ax; pay = y - ay; bax = bx - ax; bay = by - ay; hh = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay), 0.0, 1.0); d = sqrt((pax - bax * hh) * (pax - bax * hh) + (pay - bay * hh) * (pay - bay * hh)) - thick; smoothstep(blur, 0.0, d)",
    params:{angle:{value:0.3,min:0,max:6.28},seg_len:{value:0.2,min:0.05,max:0.45},thick:{value:0.02,min:0.005,max:0.08},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","segment","line","stroke"], why:"Inigo Quilez 2D SDF — line segment. Distance to a finite line defined by angle and half-length, inflated by thick to give visible width. The most fundamental stroke primitive — every line drawing starts here. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-093", date:"2026-08-15", type:"gizmo", title:"Sine Web", tags:["Gizmo","Interactive"],
    do_pixel:"a = abs(sin(x * freq + t * speed)); b = abs(sin(y * freq + t * speed * 0.7)); c = abs(sin((x + y) * freq * 0.707 + t * speed * 1.3)); d = min(min(a, b), c); clamp(1.0 - d / thick, 0.0, 1.0)",
    params:{freq:{value:15,min:3,max:50},thick:{value:0.1,min:0.02,max:0.4},speed:{value:0.05,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","sine","web","mesh","interference","animated"], why:"Three sine wave families (horizontal, vertical, diagonal) overlaid by min(). Where any sine hits zero, a line appears. The three families create a triangulated mesh that breathes as the phases drift." } },
  { cat:"PP-094", date:"2026-08-15", type:"gizmo", title:"Skin Flash", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * grid_size); gy = floor(y * grid_size); jx = cellnoise2(gx * 1.3, gy * 2.7) * jitter; jy = cellnoise2(gx * 3.1, gy * 0.9) * jitter; cx = (gx + 0.5 + jx) / grid_size; cy = (gy + 0.5 + jy) / grid_size; dx = x - cx; dy = y - cy; d = sqrt(dx * dx + dy * dy) * grid_size; phase = cellnoise2(gx * 7.1, gy * 3.3) * 6.28318; pulse = 0.5 + 0.5 * sin(t * pulse_speed + phase); r = 0.3 * pulse; smoothstep(r, r * 0.5, d)",
    params:{grid_size:{value:12,min:3,max:40},pulse_speed:{value:0.1,min:0,max:2},jitter:{value:0.3,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","organic","chromatophore","pulse","animated"], why:"Chromatophore-like pulsing circles on a jittered grid, each with its own phase. t06_026 cuttlefish flashing." } },
  { cat:"PP-095", date:"2026-08-15", type:"gizmo", title:"Smoke Wisps", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale / stretch; n = turbulence2(px + t * speed, py - t * speed * 2.0, octaves, 2.0, 0.5); wisp = n * n; clamp(wisp * 1.5, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},stretch:{value:3,min:1,max:10},octaves:{value:5,min:1,max:8},speed:{value:0.02,min:0,max:0.3}},
    dna:{ author:"makers-factory", tags:["noise","smoke","wisps","turbulence","organic","animated"], why:"Turbulent noise stretched vertically for smoke-like wisps. Squaring darkens the field giving a low-alpha feel. t06_024 cigarette smoke." } },
  { cat:"PP-096", date:"2026-08-15", type:"gizmo", title:"Smooth Blobs", tags:["Gizmo","Interactive"],
    do_pixel:"ax = 0.35 + 0.1 * sin(t * 0.05); ay = 0.5; bx = 0.65 + 0.1 * cos(t * 0.07); by = 0.5; da = sqrt((x - ax) * (x - ax) + (y - ay) * (y - ay)); db = sqrt((x - bx) * (x - bx) + (y - by) * (y - by)); h = clamp(0.5 + 0.5 * (db - da) / k, 0.0, 1.0); d = (db * (1.0 - h) + da * h) - k * h * (1.0 - h); smoothstep(radius + 0.01, radius, d)",
    params:{k:{value:0.15,min:0.01,max:0.5},radius:{value:0.15,min:0.05,max:0.4}},
    dna:{ author:"makers-factory", tags:["sdf","smin","blobs","organic","animated"], why:"smin from st_001 in taste_07 — the skinner. Two blobs joined by smooth minimum. k is the skin. The connectivity is free. A character with no mesh — bones and a k." } },
  { cat:"PP-097", date:"2026-08-15", type:"gizmo", title:"Solarize", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = turbulence2(px, py, 5, 2.0, 0.5); clamp(sin(n * cycles * 3.14159), 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},cycles:{value:4,min:1,max:15}},
    dna:{ author:"makers-factory", tags:["noise","solarize","inversion","psychedelic"], why:"sin(noise * freq) — the photographic solarization effect applied to turbulence. Where noise crosses a half-cycle boundary the tone inverts, creating the Sabattier-effect zones. Cycles dial = how many inversions fit in the noise range." } },
  { cat:"PP-098", date:"2026-08-15", type:"gizmo", title:"Spiral Ripple", tags:["Gizmo","Interactive"],
    do_pixel:"cx = x - 0.5; cy = y - 0.5; r = sqrt(cx * cx + cy * cy); theta = atan2(cy, cx); v = abs(sin(r * freq - theta * arms + t * speed)); clamp(v * max(1.0 - r * falloff, 0.0), 0.0, 1.0)",
    params:{freq:{value:20,min:5,max:60},arms:{value:3,min:1,max:8},falloff:{value:2,min:0,max:5},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","spiral","ripple","polar","animated"], why:"Archimedean spiral with abs-fold from t06_144 potter's wheel taste. r*freq - theta*arms couples the radial rings to the angular twist. Arms=1 is a single spiral; arms=3 is a pinwheel of ripples. The fold (abs) doubles the crests." } },
  { cat:"PP-099", date:"2026-08-15", type:"gizmo", title:"Spiral Tile", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx - 0.5; fy = y * cells - gy - 0.5; h = abs(sin(gx * 127.1 + gy * 311.7) * 43758.5453); h = h - floor(h); r = sqrt(fx * fx + fy * fy); a = atan2(fy, fx); 0.5 + 0.5 * sin(a * arms + r * twist - h * 6.28318 + t * speed)",
    params:{cells:{value:6,min:2,max:20},arms:{value:3,min:1,max:10},twist:{value:8,min:1,max:30},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["pattern","spiral","pinwheel","tile","grid","animated"], why:"Per-cell pinwheel spirals: each grid cell has a spiral with arms radiating from its center, phase-offset by a per-cell hash. Arms param controls the number of spiral branches, twist controls how tightly they wind. The hash offset makes each cell spin differently, breaking repetition. Mined from Shadertoy spiral tile patterns." } },
  { cat:"PP-09A", date:"2026-08-15", type:"gizmo", title:"Spiral Wrap", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); spiral = a * arms / 6.28318 + r * 10.0 - t * speed; frac = spiral - floor(spiral); smoothstep(thickness, 0.0, abs(frac - 0.5))",
    params:{arms:{value:3,min:1,max:12},thickness:{value:0.1,min:0.01,max:0.5},speed:{value:0.03,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","spiral","archimedean","animated"], why:"Archimedean spiral with adjustable arm count and thickness. Spiral patterns in taste corpus." } },
  { cat:"PP-09B", date:"2026-08-15", type:"gizmo", title:"Staircase", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; n = noise2(px, py); g = x + n * warp; floor(g * steps) / steps",
    params:{scale:{value:3,min:0.5,max:15},steps:{value:8,min:2,max:30},warp:{value:0.15,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","gradient","stepped","quantize","noise"], why:"Horizontal gradient quantized into steps, warped by noise. Clean steps at warp=0, organic terraced landscape as warp rises. The floor() operation is what st_003 (taste_07) called 'cell-ID from continuous space'." } },
  { cat:"PP-09C", date:"2026-08-15", type:"gizmo", title:"Stairs", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; bax = sw * sn; bay = sh * sn; cx1 = clamp(px, 0.0, bax); dx1 = px - cx1; dy1 = py; dd1 = dx1 * dx1 + dy1 * dy1; cx2 = clamp(py, 0.0, bay); dx2 = px - bax; dy2 = py - cx2; dd2 = dx2 * dx2 + dy2 * dy2; dd = min(dd1, dd2); ss = max(-py, px - bax) > 0.0 ? 1.0 : -1.0; dia = sqrt(sw * sw + sh * sh); rpx = (sw * px - sh * py) / dia; rpy = (sh * px + sw * py) / dia; rid = clamp(round(rpx / dia), 0.0, sn - 1.0); rpx = rpx - rid * dia; fpx = (sw * rpx + sh * rpy) / dia; fpy = (-sh * rpx + sw * rpy) / dia; hh = sh / 2.0; fpy = fpy - hh; sgnfpx = fpx > 0.0 ? 1.0 : -1.0; ss = fpy > hh * sgnfpx ? 1.0 : ss; npx = rid < 0.5 ? fpx : (fpx > 0.0 ? fpx : -fpx); npy = rid < 0.5 ? fpy : (fpx > 0.0 ? fpy : -fpy); cy3 = clamp(npy, -hh, hh); dx3 = npx; dy3 = npy - cy3; dd = min(dd, dx3 * dx3 + dy3 * dy3); cx4 = clamp(npx, 0.0, sw); dx4 = npx - cx4; dy4 = npy - hh; dd = min(dd, dx4 * dx4 + dy4 * dy4); d = sqrt(dd) * ss; smoothstep(blur, 0.0, d)",
    params:{sw:{value:0.06,min:0.02,max:0.15},sh:{value:0.05,min:0.02,max:0.15},sn:{value:4,min:2,max:8},blur:{value:0.005,min:0.001,max:0.05}},
    dna:{ author:"makers-factory", tags:["sdf","shape","stairs","steps","staircase"], why:"Inigo Quilez 2D SDF — stairs (staircase). An n-step staircase shape built by rotating coordinates to align with the diagonal, snapping to the nearest step via round(), then measuring distance to the step edges. Uses two 2x2 rotation matrices (forward and inverse). Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-09D", date:"2026-08-15", type:"gizmo", title:"Star Poly", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; d1 = max(0.809017 * px - 0.587785 * py, 0.0); px = px - 1.618034 * d1; py = py + 1.17557 * d1; d2 = max(-0.809017 * px - 0.587785 * py, 0.0); px = px + 1.618034 * d2; py = py + 1.17557 * d2; px = abs(px); py = py - radius; bax = ratio * 0.587785; bay = ratio * 0.809017 - 1.0; h = clamp((px * bax + py * bay) / (bax * bax + bay * bay), 0.0, radius); ex = px - bax * h; ey = py - bay * h; d = sqrt(ex * ex + ey * ey) * ((py * bax - px * bay) > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.48},ratio:{value:0.4,min:0.15,max:0.85},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","star","polygon"], why:"Inigo Quilez 2D SDF — five-pointed star via polar sector folding and reflections. Radius controls outer size, ratio controls inner/outer proportion (low ratio = sharp spikes, high ratio = stubby pentagon). Two reflections fold the plane into one sector of the star. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-09E", date:"2026-08-15", type:"gizmo", title:"Stepped Noise", tags:["Gizmo","Interactive"],
    do_pixel:"n = noise2(x * freq + t * drift, y * freq) * 0.5 + 0.5; floor(n * steps) / steps",
    params:{freq:{value:4,min:1,max:20},steps:{value:5,min:2,max:16},drift:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","quantized","stepped","terraced","topographic"], why:"Quantized noise — floor(noise * N) / N produces discrete brightness plateaus. Like a topographic map of a noise field. Steps controls the number of distinct levels: 2 gives binary, 16 gives subtle banding. The simplest possible posterization of continuous noise. Source: Book of Shaders noise chapter, general posterization technique." } },
  { cat:"PP-09F", date:"2026-08-15", type:"gizmo", title:"String Art", tags:["Gizmo","Interactive"],
    do_pixel:"total = 0.0; px = x - 0.5; py = y - 0.5; i = 0.0; i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); i = i + 1.0; a1 = i * 6.28318 / 20.0 + t * speed; a2 = i * 6.28318 / 20.0 * 1.618 - t * speed * 0.7; x1 = cos(a1) * radius1; y1 = sin(a1) * radius1; x2 = cos(a2) * radius2; y2 = sin(a2) * radius2; dx = x2 - x1; dy = y2 - y1; len = sqrt(dx * dx + dy * dy) + 0.0001; nx = -dy / len; ny = dx / len; dist = abs((px - x1) * nx + (py - y1) * ny); along = ((px - x1) * dx + (py - y1) * dy) / (len * len); seg = (along >= 0.0 && along <= 1.0) ? 1.0 : 0.0; total = total + seg * smoothstep(0.005, 0.0, dist); clamp(total / 3.0, 0.0, 1.0)",
    params:{lines:{value:100,min:10,max:500},radius1:{value:0.3,min:0.05,max:0.5},radius2:{value:0.2,min:0.05,max:0.5},speed:{value:0.01,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","string-art","envelope","lines","animated"], why:"Line envelope between two counter-rotating parametric circles. Bright where lines accumulate. t06_012/042 line-envelope family." } },
  { cat:"PP-0A0", date:"2026-08-15", type:"gizmo", title:"Striped Sphere", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); circle = smoothstep(radius + 0.005, radius - 0.005, d); stripe = 0.5 + 0.5 * sin(y * stripe_freq * 6.28318 + t * speed); circle * stripe",
    params:{radius:{value:0.3,min:0.05,max:0.5},stripe_freq:{value:20,min:2,max:60},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","sdf","sphere","stripes","masked","animated"], why:"2D SDF circle with horizontal stripes masked to the circle boundary. From t06_040 sphere + fabric." } },
  { cat:"PP-0A1", date:"2026-08-15", type:"gizmo", title:"Sunburst", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx) + t * speed; ray = 0.5 + 0.5 * sin(a * rays); ray * smoothstep(0.6, 0.1, r)",
    params:{rays:{value:8,min:2,max:30},speed:{value:0.3,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","radial","sunburst","rays","angular","animated"], why:"Radial ray pattern: sin(angle * N) produces N smooth rays emanating from center. The smoothstep radial fade creates a natural vignette — bright center fading to dark at edges. Speed rotates the whole pattern. A fundamental angular-domain primitive, complementary to concentric patterns like MoireRings. Mined from LYGIA generative/ angular functions." } },
  { cat:"PP-0A2", date:"2026-08-15", type:"gizmo", title:"Superformula", tags:["Gizmo","Interactive"],
    do_pixel:"cx = x - 0.5; cy = y - 0.5; a = atan2(cy, cx) + t * spin; dd = sqrt(cx * cx + cy * cy); ta = pow(abs(cos(sym * a / 4.0)), n2); tb = pow(abs(sin(sym * a / 4.0)), n3); sf = pow(ta + tb + 0.0001, -1.0 / n1) * size; clamp(1.0 - abs(dd - sf) / edge, 0.0, 1.0)",
    params:{sym:{value:6,min:1,max:12},n1:{value:1,min:0.1,max:10},n2:{value:1,min:0.1,max:10},n3:{value:1,min:0.1,max:10},size:{value:0.25,min:0.05,max:0.45},edge:{value:0.02,min:0.005,max:0.1},spin:{value:0.005,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","polar","superformula","shape","organic","animated"], why:"Superformula from st_026 in taste_07. Six numbers generate circles, squares, stars, starfish, diatoms, flowers. All from one equation." } },
  { cat:"PP-0A3", date:"2026-08-15", type:"gizmo", title:"Tan Ridge", tags:["Gizmo","Interactive"],
    do_pixel:"n = noise2(x * nscale, y * nscale); v = tan(x * freq + n * warp) * tan(y * freq + n * warp); clamp(0.5 + v * gain, 0.0, 1.0)",
    params:{freq:{value:10,min:2,max:40},nscale:{value:3,min:0.5,max:15},warp:{value:3,min:0,max:10},gain:{value:0.05,min:0.01,max:0.3}},
    dna:{ author:"makers-factory", tags:["pattern","tangent","ridge","grid","noise"], why:"tan(x)*tan(y) with noise injected into both arguments — from t06_204. Where either tangent crosses zero: a ridge. Where both poles align: a bright spike. The noise warps the grid into a cracked-glaze / crazed-glass pattern. Gain keeps the spikes under control." } },
  { cat:"PP-0A4", date:"2026-08-15", type:"gizmo", title:"Ten Print", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cols); gy = floor(y * cols); fx = x * cols - gx; fy = y * cols - gy; h = abs(sin(gx * 127.1 + gy * 311.7 + floor(t) * 43.17) * 43758.5453); h = h - floor(h); d1 = abs(fx - fy) * 0.7071; d2 = abs(fx + fy - 1.0) * 0.7071; d = (h < 0.5) ? d1 : d2; smoothstep(width, 0.0, d)",
    params:{cols:{value:16,min:4,max:40},width:{value:0.06,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","maze","random","diagonal","retro"], why:"The 10 PRINT maze: random / or \\ per cell, the Commodore 64 one-liner. From Book of Shaders ch.10 — where random meets pattern. Each cell flips a coin and draws one diagonal. The emergent paths and loops are the magic. floor(t) in hash lets it reshuffle per frame." } },
  { cat:"PP-0A5", date:"2026-08-15", type:"gizmo", title:"Tidal Erosion", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; base = noise2(px, py); detail = noise2(px * 4.0, py * 4.0); eroded = base - detail * erosion; fine = noise2(px * 8.0, py * 8.0); eroded = eroded - fine * erosion * 0.3; clamp(eroded * 0.5 + 0.5, 0.0, 1.0)",
    params:{scale:{value:4,min:0.5,max:20},erosion:{value:0.5,min:0,max:2},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","erosion","tidal","terrain","animated"], why:"Layered noise at different scales subtracted to create erosion-like patterns. Gallery-ready per Robbo crit. From t06 tidal_erosion_field." } },
  { cat:"PP-0A6", date:"2026-08-15", type:"gizmo", title:"Trapezoid", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; k1x = top_w; k1y = height; k2x = top_w - bot_w; k2y = 2.0 * height; tw = py < 0.0 ? bot_w : top_w; cax = px - min(px, tw); cay = abs(py) - height; dpk = (k1x - px) * k2x + (k1y - py) * k2y; dk2 = k2x * k2x + k2y * k2y + 0.0001; tc = clamp(dpk / dk2, 0.0, 1.0); cbx = px - k1x + k2x * tc; cby = py - k1y + k2y * tc; s = (cbx < 0.0 && cay < 0.0) ? -1.0 : 1.0; dca = cax * cax + cay * cay; dcb = cbx * cbx + cby * cby; d = s * sqrt(min(dca, dcb)); smoothstep(blur, 0.0, d)",
    params:{bot_w:{value:0.2,min:0.03,max:0.4},top_w:{value:0.12,min:0.03,max:0.4},height:{value:0.15,min:0.03,max:0.3},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","trapezoid","polygon","tapered"], why:"Inigo Quilez 2D SDF — trapezoid. A four-sided shape with parallel top and bottom edges of different widths (bot_w, top_w), connected by sloped sides of height. The keystone, the bucket, the perspective vanishing box. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-0A7", date:"2026-08-15", type:"gizmo", title:"Triangle", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5) / radius - 1.0; py = (y - 0.5) / radius + 0.57735; cond = px + 1.732050 * py; nx = cond > 0.0 ? (px - 1.732050 * py) * 0.5 : px; ny = cond > 0.0 ? (-1.732050 * px - py) * 0.5 : py; nx = nx - clamp(nx, -2.0, 0.0); d = -sqrt(nx * nx + ny * ny) * (ny > 0.0 ? 1.0 : -1.0) * radius; smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.2,min:0.05,max:0.35},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","triangle","equilateral","polygon"], why:"Inigo Quilez 2D SDF — equilateral triangle via conditional reflection. One reflection folds the plane in half, then distance to the nearest edge gives the exact SDF. The simplest regular polygon and the structural unit of every mesh. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-0A8", date:"2026-08-15", type:"gizmo", title:"Triangle Tile", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale * 1.1547; sk = py - px * 0.5; ix = floor(px); iy = floor(sk); fx = px - ix; fy = sk - iy; tri = (fx + fy > 1.0) ? 1.0 : 0.0; tfx = (tri > 0.5) ? (1.0 - fx) : fx; tfy = (tri > 0.5) ? (1.0 - fy) : fy; cx = ix + tri; cy = iy; h = abs(sin(cx * 127.1 + cy * 311.7 + tri * 57.29) * 43758.5453); h = h - floor(h); ed = min(tfx, min(tfy, 1.0 - tfx - tfy)); mortar = smoothstep(0.0, gap, ed); h * mortar",
    params:{scale:{value:8,min:2,max:30},gap:{value:0.05,min:0.01,max:0.15}},
    dna:{ author:"makers-factory", tags:["pattern","tile","triangle","grid","geometric"], why:"Equilateral triangle tiling: skewed coordinate system splits each parallelogram cell into two triangles via the fx+fy>1 test. Per-cell hash gives random brightness. The dual of the hexagonal grid — HexGrid draws hexagons, TriangleTile draws the triangles between their centres." } },
  { cat:"PP-0A9", date:"2026-08-15", type:"gizmo", title:"Truchet Tile", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx; fy = y * cells - gy; h = abs(sin(gx * 127.1 + gy * 311.7) * 43758.5453); h = h - floor(h); s = clamp((h - bias) * 10000.0, 0.0, 1.0); fx2 = fx * (1.0 - s) + (1.0 - fx) * s; d1 = abs(sqrt(fx2 * fx2 + (fy - 1.0) * (fy - 1.0)) - radius); d2 = abs(sqrt((fx2 - 1.0) * (fx2 - 1.0) + fy * fy) - radius); d = min(d1, d2); clamp(1.0 - d / width, 0.0, 1.0)",
    params:{cells:{value:8,min:2,max:30},bias:{value:0.5,min:0,max:1},radius:{value:0.5,min:0.1,max:0.9},width:{value:0.08,min:0.01,max:0.3}},
    dna:{ author:"makers-factory", tags:["pattern","grid","truchet","tile","textile"], why:"Truchet tiling from st_018 in taste_07. One arc per cell, one coin flip. Radius at 0.5 = circles close. Line thickness walks it from line to mass. 'Incredibly tactile — designing clothing patterns, materials, prints' — Robbo." } },
  { cat:"PP-0AA", date:"2026-08-15", type:"gizmo", title:"Truchet Tri State", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx; fy = y * cells - gy; h = abs(sin(gx * 127.1 + gy * 311.7) * 43758.5453); h = h - floor(h); state = floor(h * 3.0); da = min(abs(sqrt(fx * fx + (fy - 1.0) * (fy - 1.0)) - 0.5), abs(sqrt((fx - 1.0) * (fx - 1.0) + fy * fy) - 0.5)); db = min(abs(sqrt(fx * fx + fy * fy) - 0.5), abs(sqrt((fx - 1.0) * (fx - 1.0) + (fy - 1.0) * (fy - 1.0)) - 0.5)); dc = abs(sqrt((fx - 0.5) * (fx - 0.5) + (fy - 0.5) * (fy - 0.5)) - 0.25); d = (state < 1.0) ? da : ((state < 2.0) ? db : dc); smoothstep(width, 0.0, d)",
    params:{cells:{value:8,min:2,max:30},width:{value:0.06,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","truchet","tile","three-state","grid"], why:"Three-state Truchet tiling: each cell randomly picks one of three configurations — arc pair A (corners 0,1 and 1,0), arc pair B (corners 0,0 and 1,1), or a centred circle. The third state breaks the binary monotony of standard Truchet, creating dead-ends and islands in the path network. Mined from Shadertoy multi-state Truchet explorations." } },
  { cat:"PP-0AB", date:"2026-08-15", type:"gizmo", title:"Truchet Weave", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx; fy = y * cells - gy; h = abs(sin(gx * 127.1 + gy * 311.7) * 43758.5453); h = h - floor(h); da1 = abs(sqrt(fx * fx + (fy - 1.0) * (fy - 1.0)) - 0.5); da2 = abs(sqrt((fx - 1.0) * (fx - 1.0) + fy * fy) - 0.5); da = min(da1, da2); db1 = abs(sqrt(fx * fx + fy * fy) - 0.5); db2 = abs(sqrt((fx - 1.0) * (fx - 1.0) + (fy - 1.0) * (fy - 1.0)) - 0.5); db = min(db1, db2); fa = smoothstep(width, 0.0, da); fb = smoothstep(width, 0.0, db); s = (h > 0.5) ? 1.0 : 0.0; over = fa * (1.0 - s) + fb * s; under = fb * (1.0 - s) + fa * s; over + under * (1.0 - over) * 0.4",
    params:{cells:{value:8,min:2,max:30},width:{value:0.08,min:0.01,max:0.3}},
    dna:{ author:"makers-factory", tags:["pattern","truchet","weave","textile","grid"], why:"Intertwined Truchet arcs: both arc pairs drawn per cell with over-under occlusion. The hash determines which pair is 'over' (full brightness) vs 'under' (40% brightness, occluded by the over). Creates a woven fabric illusion from the same math as TruchetTile. Mined from Smith (1987) and Shadertoy Truchet variations." } },
  { cat:"PP-0AC", date:"2026-08-15", type:"gizmo", title:"Tunnel", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = -(y - 0.5); qx = px - tunnel_w; qy = py - tunnel_h; mx1 = max(qx, 0.0); d1 = mx1 * mx1 + qy * qy; lp = sqrt(px * px + py * py); qx2 = py > 0.0 ? qx : lp - tunnel_w; my2 = max(qy, 0.0); d2 = qx2 * qx2 + my2 * my2; dd = sqrt(min(d1, d2)); d = max(qx2, qy) < 0.0 ? -dd : dd; smoothstep(blur, 0.0, d)",
    params:{tunnel_w:{value:0.15,min:0.03,max:0.4},tunnel_h:{value:0.1,min:0.03,max:0.3},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","tunnel","arch","gateway"], why:"Inigo Quilez 2D SDF — tunnel (arch shape). A rectangle with a semicircular top — the tunnel mouth, the cathedral window, the archway. The semicircle smoothly joins the straight walls. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-0AD", date:"2026-08-15", type:"gizmo", title:"Tunnel Zoom", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; a = atan2(dy, dx); r = sqrt(dx * dx + dy * dy) + 0.0001; angular = 0.5 + 0.5 * sin(a * rays); radial = 0.5 + 0.5 * sin(depth / r - t * speed); angular * radial",
    params:{rays:{value:12,min:2,max:40},depth:{value:5,min:1,max:20},speed:{value:0.1,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","tunnel","radial","zoom","animated"], why:"Radial lines from centre with sin modulation creating a tunnel fly-through. t06_046 warp tunnel." } },
  { cat:"PP-0AE", date:"2026-08-15", type:"gizmo", title:"Turbulence Warp", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; n = turbulence2(px, py, octaves, 2.0, 0.5); abs(n * 2.0 - 1.0)",
    params:{scale:{value:4,min:0.5,max:20},octaves:{value:5,min:1,max:8},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","turbulence","fire","animated"], why:"abs(noise) gives turbulence/fire look. One abs() is the difference between a cloud and a fire. From st_004 turbulence fold in taste_07." } },
  { cat:"PP-0AF", date:"2026-08-15", type:"gizmo", title:"Twist Grid", tags:["Gizmo","Interactive"],
    do_pixel:"cx = floor(x * cols); cy = floor(y * rows); fx = x * cols - cx; fy = y * rows - cy; dc = sqrt((cx / cols - 0.5) * (cx / cols - 0.5) + (cy / rows - 0.5) * (cy / rows - 0.5)); angle = dc * twist + t * speed; ca = cos(angle); sa = sin(angle); rx = (fx - 0.5) * ca - (fy - 0.5) * sa; ry = (fx - 0.5) * sa + (fy - 0.5) * ca; smoothstep(size + 0.01, size, max(abs(rx), abs(ry)))",
    params:{cols:{value:10,min:3,max:30},rows:{value:10,min:3,max:30},twist:{value:6,min:0,max:30},speed:{value:0.02,min:0,max:0.5},size:{value:0.35,min:0.1,max:0.49}},
    dna:{ author:"makers-factory", tags:["pattern","grid","rotation","twist","animated"], why:"Per-tile rotation proportional to distance from grid centre. Squares become diamonds become a spiral vortex. The 2D rotation matrix applied to tile-local coordinates — what Book of Shaders calls 'rotating the coordinate system, not the shape.' Twist controls radial rotation rate, speed animates the whole field." } },
  { cat:"PP-0B0", date:"2026-08-15", type:"gizmo", title:"Uneven Capsule", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; bb = (bot_r - top_r) / height; aa = sqrt(max(1.0 - bb * bb, 0.0)); k = px * (-bb) + py * aa; d1 = sqrt(px * px + py * py) - bot_r; dy2 = py - height; d2 = sqrt(px * px + dy2 * dy2) - top_r; d3 = px * aa + py * bb - bot_r; d = k < 0.0 ? d1 : (k > aa * height ? d2 : d3); smoothstep(blur, 0.0, d)",
    params:{bot_r:{value:0.1,min:0.02,max:0.25},top_r:{value:0.05,min:0.02,max:0.2},height:{value:0.15,min:0.05,max:0.35},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","capsule","pill","tapered"], why:"Inigo Quilez 2D SDF — uneven capsule. Two semicircles of different radii (bot_r, top_r) connected by tangent lines, separated vertically by height. A tapered pill shape — the bone, the limb, the connector between thick and thin. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-0B1", date:"2026-08-15", type:"gizmo", title:"Vein Network", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; eps = 0.01; n0 = turbulence2(px, py, 4, 2.0, 0.5); nx = turbulence2(px + eps, py, 4, 2.0, 0.5); ny = turbulence2(px, py + eps, 4, 2.0, 0.5); gx2 = (nx - n0) / eps; gy2 = (ny - n0) / eps; grad = sqrt(gx2 * gx2 + gy2 * gy2); clamp(grad * gain, 0.0, 1.0)",
    params:{scale:{value:3,min:0.5,max:15},gain:{value:0.3,min:0.05,max:2}},
    dna:{ author:"makers-factory", tags:["noise","gradient","vein","edge","organic"], why:"Gradient magnitude of turbulence — the finite-difference derivative finds where the noise field changes fastest. Those are the edges, ridges, veins. Three noise lookups per pixel (center, +dx, +dy) to approximate the partial derivatives." } },
  { cat:"PP-0B2", date:"2026-08-15", type:"gizmo", title:"Vesica", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; d1 = sqrt((px + sep) * (px + sep) + py * py) - radius; d2 = sqrt((px - sep) * (px - sep) + py * py) - radius; d = max(d1, d2); smoothstep(blur, 0.0, d)",
    params:{sep:{value:0.15,min:0,max:0.35},radius:{value:0.3,min:0.1,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","vesica","lens","intersection"], why:"Vesica piscis — the lens formed by intersecting two circles. SDF intersection via max(d1,d2). Sep controls the gap between circle centres: sep=0 collapses to a full circle, sep approaching radius thins to a sliver. The sacred geometry shape that keeps showing up in Gothic windows and Venn diagrams. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-0B3", date:"2026-08-15", type:"gizmo", title:"Voronoi Glow", tags:["Gizmo","Interactive"],
    do_pixel:"f1 = voronoi2(x * scale + t * drift, y * scale, 1, jitter); f2 = voronoi2(x * scale + t * drift, y * scale, 2, jitter); ratio = f1 / max(f2, 0.001); glow = pow(1.0 - clamp(ratio, 0.0, 1.0), sharpness); glow",
    params:{scale:{value:6,min:1,max:25},sharpness:{value:3,min:0.5,max:10},jitter:{value:1,min:0,max:1},drift:{value:0.01,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["voronoi","glow","cellular","edges","animated"], why:"Voronoi edge glow from F1/F2 ratio. At cell centers F1/F2 approaches 0 (dark), at edges it approaches 1 (bright). The pow(1-ratio, sharpness) inversion makes edges glow. CrackedMud uses F2-F1 for hard crack lines; this uses the ratio for soft luminous edges. Mined from Shadertoy voronoi techniques." } },
  { cat:"PP-0B4", date:"2026-08-15", type:"gizmo", title:"Voronoi Rings", tags:["Gizmo","Interactive"],
    do_pixel:"d = voronoi2(x * scale, y * scale, 0, jitter); clamp(0.5 + 0.5 * sin(d * rings + t * speed), 0.0, 1.0)",
    params:{scale:{value:5,min:1,max:20},rings:{value:15,min:2,max:50},jitter:{value:1,min:0,max:1},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","voronoi","rings","contour","crystal","animated"], why:"Voronoi distance field wrapped through sin() — from t06_244 crystallized taste. Each cell gets concentric rings like a topographic map of a crystal lattice. The sharp creases at Voronoi seams are free — they come from the distance function discontinuity." } },
  { cat:"PP-0B5", date:"2026-08-15", type:"gizmo", title:"Warped FBM", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; qx = turbulence2(px + t * speed, py, 3, 2.0, 0.5); qy = turbulence2(px + 5.2, py + 1.3, 3, 2.0, 0.5); turbulence2(px + warp * qx, py + warp * qy, octaves, 2.0, 0.5)",
    params:{scale:{value:3,min:0.5,max:15},warp:{value:3,min:0,max:12},octaves:{value:4,min:1,max:8},speed:{value:0.02,min:0,max:0.3}},
    dna:{ author:"makers-factory", tags:["noise","warp","fbm","cloud","organic","animated"], why:"Warped fBm: turbulence warps turbulence — f(p) = fbm(p + fbm(p)). From Book of Shaders ch.13. DomainWarp uses noise2 (single-octave, smooth) for warping; WarpedFBM uses turbulence2 (multi-octave, detailed) for richer, more organic cloud-like structures with deeper self-similarity." } },
  { cat:"PP-0B6", date:"2026-08-15", type:"gizmo", title:"Wave Mesh", tags:["Gizmo","Interactive"],
