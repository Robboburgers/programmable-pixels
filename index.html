<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programmable Pixels</title>
<meta name="description" content="Programmable Pixels — games, animations, music and live code. One operator, one feed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PROGRAMMABLE PIXELS — "the work is the interface"
   Neutral ground, small utility tags, full-bleed media.
   Rebrand: change the wordmark in <header> and --ink if needed.
   ============================================================ */
:root{
  --ground:  #F6F6F4;
  --ink:     #111111;
  --grey:    #8C8C88;
  --line:    #E3E3DF;
  --media:   #0B0B0C;   /* media blocks sit dark inside the light page */
  --font-display: "Univers Next", "Univers LT Std", "Univers", "Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
  --col: min(680px, 100%);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--ground); }
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--ground);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  -webkit-font-smoothing:antialiased;
}

/* ---- header: wordmark, live dot, nothing else ---- */
header{
  width:var(--col);
  padding:22px 20px;
  display:flex; align-items:center; justify-content:space-between;
}
.wordmark{
  font-family:var(--font-display);
  font-size:clamp(20px, 5.6vw, 28px); font-weight:800; letter-spacing:-.025em;
  text-transform:uppercase;
}
.live{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  color:var(--grey); display:flex; align-items:center; gap:6px;
  text-transform:uppercase;
}
.live .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.2} }

/* ---- feed ---- */
main{ width:var(--col); display:flex; flex-direction:column; }

.post{ padding:26px 20px 34px; border-top:1px solid var(--line); }
.tags{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  color:var(--grey); text-transform:uppercase;
  display:flex; gap:14px; margin-bottom:10px; align-items:baseline;
}
.tags .cat{ color:var(--ink); font-weight:500; }
.tags .date{ margin-left:auto; font-size:10px; }
.post h2{ font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:-.02em; }
.post .media{ margin:14px 0 12px; }
.post p{ color:#444; font-size:15.5px; line-height:1.65; max-width:56ch; }
.post p + p{ margin-top:10px; }

/* text-only posts read larger, like a statement */
.post.is-text p{ font-size:17px; color:var(--ink); }

/* media blocks */
.frame{
  width:100%; background:var(--media); border-radius:2px; overflow:hidden;
  position:relative;
}
.frame.r45{ aspect-ratio:4/5; }
.frame.r43{ aspect-ratio:4/3; }
.frame.r43 canvas{ image-rendering:pixelated; }
.frame.r169{ aspect-ratio:16/9; }
.frame canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.frame .corner{
  position:absolute; left:10px; bottom:8px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
  color:rgba(255,255,255,.65); text-transform:uppercase; pointer-events:none;
}
.frame.is-slot{ display:flex; align-items:center; justify-content:center; }
.art{
  display:block; width:100%; height:auto;
  background:var(--media); border-radius:2px;
}
.frame.is-slot span{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
  color:rgba(255,255,255,.4); text-transform:uppercase;
}
#wgl{ cursor:crosshair; }

/* minimal audio row */
.audio{ display:flex; align-items:center; gap:16px; margin:14px 0 12px; }
.playbtn{
  width:52px; height:52px; border-radius:50%;
  border:1px solid var(--ink); background:none; color:var(--ink);
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; cursor:pointer; flex-shrink:0;
  transition:background .15s, color .15s;
}
.playbtn:hover, .playbtn:focus-visible{ background:var(--ink); color:var(--ground); }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
.wave{ flex:1; height:36px; display:flex; align-items:center; gap:3px; }
.wave span{ flex:1; height:2px; background:var(--line); transition:height .12s linear; }
.audio.playing .wave span{ background:var(--ink); }

/* links, plain and underlined */
.plain{
  color:var(--ink); font-size:15px; font-weight:500;
  text-decoration:underline; text-underline-offset:3px;
}
.plain:hover{ color:var(--grey); }

/* email: single underlined line */
.lock{ display:flex; gap:10px; margin-top:14px; max-width:420px; }
.lock input{
  flex:1; min-width:0; background:none; color:var(--ink);
  border:none; border-bottom:1px solid var(--ink);
  padding:8px 0; font-family:var(--font-mono); font-size:13px;
}
.lock input::placeholder{ color:var(--grey); }
.lock button{
  background:none; border:none; cursor:pointer;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink);
  border-bottom:1px solid transparent;
}
.lock button:hover{ border-bottom-color:var(--ink); }
.lock-msg{ margin-top:10px; font-family:var(--font-mono); font-size:12px; color:var(--grey); min-height:1em; }

footer{
  width:var(--col); padding:30px 20px 56px;
  border-top:1px solid var(--line);
  font-family:var(--font-mono); font-size:11px; color:var(--grey);
  letter-spacing:.06em; line-height:2; text-transform:uppercase;
}

@media (prefers-reduced-motion: reduce){
  .live .dot{ animation:none; }
  .wave span{ transition:none; }
}

/* ---- gizmo (interactive per-pixel art) ---- */
.frame.r11{ aspect-ratio:1/1; }
.gizmo-panel{
  padding:12px 0 4px; display:flex; flex-wrap:wrap; gap:8px 18px;
}
.gizmo-panel label{
  font-family:var(--font-mono); font-size:11px; color:var(--grey);
  display:flex; align-items:center; gap:8px; letter-spacing:.04em;
  text-transform:uppercase; white-space:nowrap;
}
.gizmo-panel input[type=range]{
  width:90px; accent-color:var(--ink);
}
.gizmo-panel .val{
  min-width:32px; text-align:right; font-variant-numeric:tabular-nums;
}

/* ---- patch (gizmos wired through the reader) ---- */
.wire-row{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
  color:var(--grey); padding:12px 0 0; text-transform:uppercase;
}
.wire-row .wire{ color:var(--ink); }
.dl-row{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
  padding:10px 0 4px; display:flex; gap:18px;
}
.dl-row a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
.dl-row a:hover{ border-bottom-color:var(--ink); }
</style>
</head>
<body>

<header>
  <div class="wordmark">Programmable Pixels</div>
  <div class="live"><span class="dot"></span>Live</div>
</header>

<main id="feed"></main>

<footer>
  Programmable Pixels — one operator<br>
  © <span id="yr"></span>
</footer>

<script src="reader.js"></script>
<script>
/* ============================================================
   THE FEED IS A LIST. Publish = append one object.
   Newest first on screen; catalogue numbers are permanent.

   CATALOGUE RULES (Factory style):
   - Every entry gets the next hex number: PP-001 ... PP-00A ... PP-0FF
   - Numbers are NEVER reused or renumbered, even if a piece is pulled.
   - Everything gets a number: works, the site itself, the mailing list.
   - `date` is the day it entered the catalogue. Both are immutable.
   ============================================================ */
const POSTS = [
  { cat:"PP-0BD", date:"2026-08-15", type:"patch", title:"Pulse", tags:["Gizmo","Patch","Interactive"],
    def:{ name:"Pulse", class:"Generator",
      ports:{ in:[], out:[{name:"wave",type:"float"}] },
      params:{ rate:{value:0.05,min:0.005,max:0.3,step:0.005} },
      body:{ expr:"0.5 + 0.5 * sin(t * rate)" } },
    chain:{ fromPort:"wave", to:"PP-018", toPort:"warp" },
    downloads:[ {label:"pulse.gizmo.json", href:"gizmos/pulse/pulse.gizmo.json"},
                {label:"folder (zip)", href:"assets/pp-0bd.zip"} ],
    dna:{ author:"robbo", tags:["lfo","float","first-connectable"],
      why:"The first connectable gizmo in the catalogue. A slow sine on a float port — the LFO of every synthesizer. Its wave out-port is wired through the reader into Domain Warp's warp param: the 165 pieces below are fields waiting for signals; this is the first signal. Download the JSON for the gizmo alone, or the folder for its DNA and its reasons." } },
  { cat:"PP-01D", date:"2026-08-14", type:"gizmo", title:"Spirograph", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; total = 0.0; i = 0.0; i = i + 1.0; freq = i * density / arms; total = total + (0.5 + 0.5 * cos(px * freq + t * 0.03 * i)) * (0.5 + 0.5 * sin(py * freq * ratio + t * 0.02 * i)); i = i + 1.0; freq = i * density / arms; total = total + (0.5 + 0.5 * cos(px * freq + t * 0.03 * i)) * (0.5 + 0.5 * sin(py * freq * ratio + t * 0.02 * i)); i = i + 1.0; freq = i * density / arms; total = total + (0.5 + 0.5 * cos(px * freq + t * 0.03 * i)) * (0.5 + 0.5 * sin(py * freq * ratio + t * 0.02 * i)); i = i + 1.0; freq = i * density / arms; total = total + (0.5 + 0.5 * cos(px * freq + t * 0.03 * i)) * (0.5 + 0.5 * sin(py * freq * ratio + t * 0.02 * i)); i = i + 1.0; freq = i * density / arms; total = total + (0.5 + 0.5 * cos(px * freq + t * 0.03 * i)) * (0.5 + 0.5 * sin(py * freq * ratio + t * 0.02 * i)); clamp(total / arms, 0.0, 1.0)",
    params:{ arms:{value:5,min:2,max:12}, ratio:{value:0.4,min:0.1,max:2.0}, density:{value:200,min:10,max:500} },
    dna:{ author:"makers-factory", tags:["spirograph","envelope","harmonic"], why:"Line-envelope style \u2014 sum of counter-rotating sine/cosine pairs. From the envelope family." } },
  { cat:"PP-01C", date:"2026-08-14", type:"gizmo", title:"Moire Rings", tags:["Gizmo","Interactive"],
    do_pixel:"dx1 = x - 0.5; dy1 = y - 0.5; d1 = sqrt(dx1 * dx1 + dy1 * dy1); dx2 = x - 0.5 - offset; dy2 = y - 0.5; d2 = sqrt(dx2 * dx2 + dy2 * dy2); w1 = 0.5 + 0.5 * sin(d1 * freq1 * 6.28318 + t * 0.05); w2 = 0.5 + 0.5 * sin(d2 * freq2 * 6.28318 + t * 0.07); w1 * w2",
    params:{ freq1:{value:30,min:5,max:100}, freq2:{value:31,min:5,max:100}, offset:{value:0.1,min:0,max:0.5} },
    dna:{ author:"makers-factory", tags:["moire","interference","rings"], why:"Two sets of concentric rings offset from each other \u2014 interference creates moire." } },
  { cat:"PP-01B", date:"2026-08-14", type:"gizmo", title:"Curl Noise", tags:["Gizmo","Interactive"],
    do_pixel:"eps = 0.005; px = x * scale + t * drift; py = y * scale; nr = noise2(px + eps, py); nl = noise2(px - eps, py); nu = noise2(px, py + eps); nd = noise2(px, py - eps); vx = nu - nd; vy = -(nr - nl); angle = atan2(vy, vx); 0.5 + 0.5 * sin(angle * bands + t * speed)",
    params:{ scale:{value:3,min:0.5,max:15}, bands:{value:3,min:1,max:10}, speed:{value:0.5,min:0,max:3}, drift:{value:0.01,min:0,max:0.2} },
    dna:{ author:"makers-factory", tags:["curl","flow","noise"], why:"Curl noise: treats scalar noise as a stream function, visualizes flow direction via atan2. From computational fluid dynamics." } },
  { cat:"PP-01A", date:"2026-08-14", type:"gizmo", title:"Chladni", tags:["Gizmo","Interactive"],
    do_pixel:"z = sin(mode_n * 3.14159 * x) * sin(mode_m * 3.14159 * y + t * morph) - sin(mode_m * 3.14159 * x) * sin(mode_n * 3.14159 * y + t * morph); clamp(1.0 - abs(z) / thresh, 0.0, 1.0)",
    params:{ mode_n:{value:3,min:1,max:12}, mode_m:{value:5,min:1,max:12}, thresh:{value:0.15,min:0.01,max:0.5}, morph:{value:0.01,min:0,max:0.5} },
    dna:{ author:"makers-factory", tags:["chladni","vibration","physics"], why:"Chladni plate vibration patterns. Sand gathers at the nodal lines where z = 0. Mode numbers control the star count." } },
  { cat:"PP-019", date:"2026-08-14", type:"gizmo", title:"Plasma Field", tags:["Gizmo","Interactive"],
    do_pixel:"v1 = sin(x * scale1 * 6.28318 + t * speed); v2 = sin(y * scale2 * 6.28318 + t * speed * 1.3); v3 = sin((x + y) * (scale1 + scale2) * 0.5 * 6.28318 + t * speed * 0.7); dx = x - 0.5; dy = y - 0.5; v4 = sin(sqrt(dx * dx + dy * dy) * (scale1 + scale2) * 6.28318 + t * speed * 1.1); 0.5 + 0.5 * (v1 + v2 + v3 + v4) * 0.25",
    params:{ scale1:{value:3,min:0.5,max:15}, scale2:{value:5,min:0.5,max:15}, speed:{value:0.03,min:0,max:0.5} },
    dna:{ author:"makers-factory", tags:["plasma","demoscene","sine"], why:"Classic plasma: sum of sines at different scales and angles. Demoscene lineage." } },
  { cat:"PP-018", date:"2026-08-14", type:"gizmo", title:"Domain Warp", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; qx = noise2(px + t * speed, py); qy = noise2(px + 5.2, py + 1.3); rx = noise2(px + warp * qx + 1.7, py + warp * qy + 9.2); ry = noise2(px + warp * qx + 8.3, py + warp * qy + 2.8); 0.5 + 0.5 * noise2(px + warp * rx, py + warp * ry)",
    params:{ scale:{value:3,min:0.5,max:20}, warp:{value:4,min:0,max:16}, speed:{value:0.02,min:0,max:0.5} },
    dna:{ author:"makers-factory", tags:["noise","warp","domain-warp","liquid","marble"], why:"Domain warping \u2014 warp 1 is the glass, warp 2 is the body under the glass. Liquid, marble, smoke." } },
{ cat:"PP-01E", date:"2026-08-15", type:"gizmo", title:"Arc", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; sx = sin(angle * 0.5); cy = cos(angle * 0.5); ex = px - sx * radius; ey = py - cy * radius; d1 = sqrt(ex * ex + ey * ey); d2 = abs(sqrt(px * px + py * py) - radius); d = (cy * px > sx * py ? d1 : d2) - thick; smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.45},angle:{value:3.14,min:0.3,max:6},thick:{value:0.03,min:0.005,max:0.1},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","arc","ring","segment"], why:"Inigo Quilez 2D SDF — arc (ring segment). A curved stroke: radius sets the sweep, angle sets the angular extent, thick inflates the centreline into a band. Outside the angular range, distance falls to the nearest endpoint cap. Pie fills a sector; Arc traces its rim. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-01F", date:"2026-08-15", type:"gizmo", title:"Basketweave", tags:["Gizmo","Interactive"],
    do_pixel:"sx = x * scale; sy = y * scale; cx = floor(sx); cy = floor(sy); fx = sx - cx; fy = sy - cy; parity = (cx + cy) - floor((cx + cy) * 0.5) * 2.0; bx = smoothstep(0.0, gap, fx) * smoothstep(0.0, gap, 1.0 - fx); by = smoothstep(0.0, gap, fy) * smoothstep(0.0, gap, 1.0 - fy); inner = parity > 0.5 ? smoothstep(0.0, gap, abs(fy - 0.5)) : smoothstep(0.0, gap, abs(fx - 0.5)); bx * by * inner",
    params:{scale:{value:6,min:2,max:20},gap:{value:0.06,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","tile","basketweave","parquet","woven"], why:"Basketweave tile pattern — alternating cells split horizontally or vertically based on checkerboard parity. Cell boundaries give the outer mortar, inner split gives the brick subdivisions. The parquet floor and woven textile share this bone structure. Distinct from BrickTile (offset rows) and WovenGrid (sinusoidal). Source: Book of Shaders pattern chapter, adapted to tile-parity logic." } },
  { cat:"PP-020", date:"2026-08-15", type:"gizmo", title:"Beat Alias", tags:["Gizmo","Interactive"],
    do_pixel:"qx = floor(x * samples) / samples; wave = sin(qx * carrier + y * ymod) * cos(qx * detune + t * speed); 0.5 + 0.5 * wave",
    params:{samples:{value:30,min:5,max:100},carrier:{value:40,min:10,max:200},detune:{value:42,min:10,max:200},ymod:{value:10,min:0,max:50},speed:{value:0.1,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","alias","beat","sampling","moire","animated"], why:"Deliberately undersampled sine from t06_245 beat-frequency taste. Two frequencies (carrier and detune) sampled at a third rate. The aliasing IS the pattern — Nyquist violations as design material. The beat frequency emerges where carrier and detune drift apart." } },
  { cat:"PP-021", date:"2026-08-15", type:"gizmo", title:"Bevel Tile", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cols); gy = floor(y * rows); fx = x * cols - gx; fy = y * rows - gy; gate = sin(gx * wfreq - gy + t * speed) > 0.0 ? 1.0 : 0.0; face = 0.5 + (fx < bw ? 0.3 : 0.0) + (fy < bw ? 0.3 : 0.0) - (fx > 1.0 - bw ? 0.3 : 0.0) - (fy > 1.0 - bw ? 0.3 : 0.0); face * gate",
    params:{cols:{value:8,min:3,max:20},rows:{value:8,min:3,max:20},bw:{value:0.15,min:0.05,max:0.35},wfreq:{value:1,min:0.2,max:5},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","grid","bevel","tile","3d-illusion","animated"], why:"Beveled tiles with plane-wave gate from t06_236. Three-rect bevel per cell — highlight on left/top edges, shadow on right/bottom, flat face between. The wave gate selects which tiles are lit. 'Shiny Maya stuff with no light in the code' — the bevel IS the light." } },
  { cat:"PP-022", date:"2026-08-15", type:"gizmo", title:"Bezier", tags:["Gizmo","Interactive"],
    do_pixel:"p0x = -bspan; p0y = -bcurve; p1x = 0.0; p1y = bcurve; p2x = bspan; p2y = -bcurve; ppx = x - 0.5; ppy = y - 0.5; aax = p1x - p0x; aay = p1y - p0y; bbx = p0x - 2.0 * p1x + p2x; bby = p0y - 2.0 * p1y + p2y; ccx = aax * 2.0; ccy = aay * 2.0; ddx = p0x - ppx; ddy = p0y - ppy; kk = 1.0 / (bbx * bbx + bby * bby + 0.000000001); kx = kk * (aax * bbx + aay * bby); ky = kk * (2.0 * (aax * aax + aay * aay) + ddx * bbx + ddy * bby) / 3.0; kz = kk * (ddx * aax + ddy * aay); ppp = ky - kx * kx; p3 = ppp * ppp * ppp; qqq = kx * (2.0 * kx * kx - 3.0 * ky) + kz; hhh = qqq * qqq + 4.0 * p3; sh = sqrt(max(abs(hhh), 0.0)); ux_raw = (sh - qqq) / 2.0; vx_raw = (-sh - qqq) / 2.0; ux_sgn = ux_raw > 0.0 ? 1.0 : -1.0; vx_sgn = vx_raw > 0.0 ? 1.0 : -1.0; ux = ux_sgn * pow(max(abs(ux_raw), 0.000000001), 0.333333333); vx = vx_sgn * pow(max(abs(vx_raw), 0.000000001), 0.333333333); t1 = clamp(ux + vx - kx, 0.0, 1.0); e1x = ddx + (ccx + bbx * t1) * t1; e1y = ddy + (ccy + bby * t1) * t1; res1 = e1x * e1x + e1y * e1y; zz = sqrt(max(-ppp, 0.000000001)); vvv = acos(clamp(qqq / (ppp * zz * 2.0 + 0.000000001), -1.0, 1.0)) / 3.0; mm = cos(vvv); nn = sin(vvv) * 1.732050808; ta = clamp((mm + mm) * zz - kx, 0.0, 1.0); tb2 = clamp((-nn - mm) * zz - kx, 0.0, 1.0); ea1x = ddx + (ccx + bbx * ta) * ta; ea1y = ddy + (ccy + bby * ta) * ta; ra1 = ea1x * ea1x + ea1y * ea1y; ea2x = ddx + (ccx + bbx * tb2) * tb2; ea2y = ddy + (ccy + bby * tb2) * tb2; ra2 = ea2x * ea2x + ea2y * ea2y; res2 = min(ra1, ra2); res = hhh > 0.0 ? res1 : res2; d = sqrt(max(res, 0.0)) - bthick; smoothstep(blur, 0.0, d)",
    params:{bspan:{value:0.2,min:0.05,max:0.4},bcurve:{value:0.15,min:0.02,max:0.35},bthick:{value:0.01,min:0.002,max:0.05},blur:{value:0.005,min:0.001,max:0.05}},
    dna:{ author:"makers-factory", tags:["sdf","shape","bezier","curve","spline"], why:"Inigo Quilez 2D SDF — quadratic Bezier curve. Three control points define a parabolic arc; the closest point is found by solving a depressed cubic. The bspan parameter sets horizontal spread, bcurve the vertical sag, bthick adds stroke width. Parameterized as a symmetric S-curve for composability. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-023", date:"2026-08-15", type:"gizmo", title:"Blobby Cross", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); ax = abs(px - py) * 0.70710678; ay = (1.0 - px - py) * 0.70710678; pp = (bhe - ay - 0.25 / bhe) / (6.0 * bhe); qq = ax / (bhe * bhe * 16.0); hh = qq * qq - pp * pp * pp; rr = sqrt(max(hh, 0.0)); cb1 = pow(max(qq + rr, 0.000000001), 0.333333333); qmr = abs(qq - rr); cb2 = pow(max(qmr, 0.000000001), 0.333333333); sgn_qr = rr > qq ? 1.0 : -1.0; x1 = cb1 - cb2 * sgn_qr; r2 = sqrt(max(pp, 0.000000001)); pr = pp * r2; aarg = clamp(qq / (abs(pr) > 0.000000001 ? pr : 0.000000001), -1.0, 1.0); x2 = 2.0 * r2 * cos(acos(aarg) / 3.0); xf = hh > 0.0 ? x1 : x2; xf = min(xf, 0.70710678); zx = xf - ax; zy = bhe * (1.0 - 2.0 * xf * xf) - ay; d = sqrt(zx * zx + zy * zy) * (zy > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{bhe:{value:0.5,min:0.1,max:1},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","blobby","cross","organic"], why:"Inigo Quilez 2D SDF — blobby cross. A soft, organic four-lobed shape. Rotates coordinates 45 degrees, then solves a depressed cubic (Cardano + trig) to find the closest point on the implicit curve y = he*(1-2x^2). The bhe parameter controls blobbiness. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-024", date:"2026-08-15", type:"gizmo", title:"Bounce Grad", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy) * scale; abs(sin(d * 3.14159 * bounces)) * pow(2.71828, 0.0 - d * decay)",
    params:{scale:{value:3,min:1,max:10},bounces:{value:3,min:1,max:10},decay:{value:1.5,min:0.1,max:5}},
    dna:{ author:"makers-factory", tags:["gradient","bounce","easing","radial","decay"], why:"Bouncing-ball spatial gradient: abs(sin) gives the bounce oscillation, exp(-d) gives the decay envelope. Together they model a ball bouncing with decreasing height — applied radially from centre. The bounces param controls oscillation frequency, decay controls how quickly the amplitude dies off. Mined from LYGIA animation/easing bounce-out function, applied spatially." } },
  { cat:"PP-025", date:"2026-08-15", type:"gizmo", title:"Box", tags:["Gizmo","Interactive"],
    do_pixel:"qx = abs(x - 0.5) - bx; qy = abs(y - 0.5) - by; mx = max(qx, 0.0); my = max(qy, 0.0); d = sqrt(mx * mx + my * my) + min(max(qx, qy), 0.0); smoothstep(blur, 0.0, d)",
    params:{bx:{value:0.2,min:0.03,max:0.48},by:{value:0.15,min:0.03,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","box","rectangle"], why:"Inigo Quilez 2D SDF — axis-aligned box. The fundamental rectangle SDF: abs for symmetry, max for interior distance, Euclidean for exterior corners. Every UI element starts here. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-026", date:"2026-08-15", type:"gizmo", title:"Breathing Ring", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); r_pulse = base_radius + pulse * sin(t * speed * 6.28318); thick_vary = 0.015 + 0.01 * sin(a * segments + t * speed * 3.0); ring = 1.0 - abs(d - r_pulse) / thick_vary; clamp(ring, 0.0, 1.0)",
    params:{base_radius:{value:0.3,min:0.05,max:0.45},pulse:{value:0.05,min:0,max:0.2},segments:{value:8,min:1,max:24},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","ring","pulse","breathing","organic","animated"], why:"Ring that pulses in radius with sine modulation, thickness varies around the perimeter. From t06 ring/pulse patterns." } },
  { cat:"PP-027", date:"2026-08-15", type:"gizmo", title:"Brick Tile", tags:["Gizmo","Interactive"],
    do_pixel:"row = floor(y * rows); shift = (row - floor(row * 0.5) * 2) * 0.5; bx = x * cols + shift; fx = bx - floor(bx); fy = y * rows - row; mx = smoothstep(0.0, gap, fx) * smoothstep(0.0, gap, 1.0 - fx); my = smoothstep(0.0, gap, fy) * smoothstep(0.0, gap, 1.0 - fy); mx * my",
    params:{cols:{value:8,min:2,max:20},rows:{value:4,min:2,max:20},gap:{value:0.05,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","tile","brick","offset-row"], why:"Offset-row tiling: odd rows shift by half a brick width. Smoothstep mortar lines give soft-edged joints. The ur-pattern of architectural texture — from Book of Shaders pattern chapter. Every brick wall is this equation plus noise." } },
  { cat:"PP-028", date:"2026-08-15", type:"gizmo", title:"Caustic Light", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; c1 = 0.5 + 0.5 * sin(px * 3.14159 + sin(py * 2.7 + t * speed) * 2.0); c2 = 0.5 + 0.5 * sin(py * 2.5 + sin(px * 3.1 + t * speed * 1.3) * 2.0); c3 = 0.5 + 0.5 * sin((px + py) * 2.0 + sin((px - py) * 1.8 + t * speed * 0.7) * 2.0); v = (c1 + c2 + c3) / layers; pow(v, 2.0)",
    params:{scale:{value:3,min:0.5,max:15},layers:{value:3,min:1,max:6},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","caustic","light","water","refraction","animated"], why:"Overlapping refracted light rings simulating underwater caustics. From t06_026 caustic readings." } },
  { cat:"PP-029", date:"2026-08-15", type:"gizmo", title:"Cell Noise", tags:["Gizmo","Interactive"],
    do_pixel:"voronoi2(x * scale + t * drift, y * scale, 1, jitter)",
    params:{scale:{value:8,min:1,max:50},jitter:{value:0.8,min:0,max:1},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","voronoi","cellular","animated"], why:"Voronoi cellular noise — the four-channel cell. st_007 in taste_07. F1 is blobs, F2-F1 is borders, cell ID is crystals in a metal. Jitter 0 snaps to hexagons, 1 is organic." } },
  { cat:"PP-02A", date:"2026-08-15", type:"gizmo", title:"Cellular Tile", tags:["Gizmo","Interactive"],
    do_pixel:"cx = floor(x * cells); cy = floor(y * cells); fx = x * cells - cx; fy = y * cells - cy; brightness = cellnoise2(cx, cy); half = shape_size * 0.5; inside = (abs(fx - 0.5) < half && abs(fy - 0.5) < half) ? 1.0 : 0.0; inside * brightness",
    params:{cells:{value:8,min:2,max:32},shape_size:{value:0.6,min:0.1,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","cellular","tile","grid","random"], why:"fract/floor tiling with per-cell random brightness from cellnoise. Cell size is the room, shape size is the tenant. From st_003/st_009 in taste_07." } },
  { cat:"PP-02B", date:"2026-08-15", type:"gizmo", title:"Chamfer Box", tags:["Gizmo","Interactive"],
    do_pixel:"qx = abs(x - 0.5) - bx; qy = abs(y - 0.5) - by; spx = qy > qx ? qy : qx; spy = qy > qx ? qx : qy; spy = spy + chamfer; k = -0.414214; d = (spy < 0.0 && spy + spx * k < 0.0) ? spx : ((spx < spy) ? (spx + spy) * 0.707107 : sqrt(spx * spx + spy * spy)); smoothstep(blur, 0.0, d)",
    params:{bx:{value:0.2,min:0.03,max:0.45},by:{value:0.15,min:0.03,max:0.45},chamfer:{value:0.05,min:0,max:0.2},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","box","chamfer","beveled"], why:"Inigo Quilez 2D SDF — chamfered box. A rectangle with the corners cut at 45 degrees. Chamfer controls how much of each corner is removed (0 = sharp rectangle, larger = more cut). The frame, the gem, the machined edge. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-02C", date:"2026-08-15", type:"gizmo", title:"Checker", tags:["Gizmo","Interactive"],
    do_pixel:"a = floor(x * cols); b = floor(y * rows); (a + b) % 2",
    params:{cols:{value:8,min:1,max:64},rows:{value:8,min:1,max:64}},
    dna:{ author:"makers-factory", tags:["pattern","grid","checker"], why:"Pipeline proof: simplest per-pixel pattern. From st_009 fract/floor in taste_07." } },
  { cat:"PP-02D", date:"2026-08-15", type:"gizmo", title:"Chirp Wave", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); fade = pow(2.71828, -d * decay); v = sin(d * d * freq - t * speed) * fade; clamp(0.5 + 0.5 * v, 0.0, 1.0)",
    params:{freq:{value:40,min:5,max:120},decay:{value:5,min:1,max:15},speed:{value:0.1,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","chirp","radial","frequency-ramp","animated"], why:"Chirp wave from t06_183 jellyfish taste — sin(d^2) makes spatial frequency increase with distance from centre. Tight rings at the rim, broad pulse at the core. The radar sweep, the water drop, the sonar ping." } },
  { cat:"PP-02E", date:"2026-08-15", type:"gizmo", title:"Circle", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; d = sqrt(px * px + py * py) - radius; smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.02,max:0.49},blur:{value:0.01,min:0.001,max:0.2}},
    dna:{ author:"makers-factory", tags:["sdf","shape","circle","disk"], why:"Inigo Quilez 2D SDF — circle. length(p) - r. The simplest possible SDF and the atom of the entire shape library. Every other shape is this one deformed. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-02F", date:"2026-08-15", type:"gizmo", title:"Circle Wave", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = y - 0.5; tb2 = 3.1415927 * 5.0 / 6.0 * max(tb, 0.0001); cox = ra * sin(tb2); coy = ra * cos(tb2); period = cox * 4.0; mx = px - period * floor(px / period); px2 = abs(mx - cox * 2.0); p1x = px2; p1y = py; p2x = abs(px2 - 2.0 * cox); p2y = -py + 2.0 * coy; v1x = p1x - cox; v1y = p1y - coy; l1 = sqrt(v1x * v1x + v1y * v1y); al1 = sqrt(p1x * p1x + p1y * p1y); d1 = coy * p1x > cox * p1y ? l1 : abs(al1 - ra); v2x = p2x - cox; v2y = p2y - coy; l2 = sqrt(v2x * v2x + v2y * v2y); al2 = sqrt(p2x * p2x + p2y * p2y); d2 = coy * p2x > cox * p2y ? l2 : abs(al2 - ra); d = min(d1, d2) - thick; smoothstep(blur, 0.0, d)",
    params:{tb:{value:0.8,min:0.01,max:1},ra:{value:0.1,min:0.03,max:0.3},thick:{value:0.01,min:0.002,max:0.05},blur:{value:0.005,min:0.001,max:0.05}},
    dna:{ author:"makers-factory", tags:["sdf","pattern","wave","circle","repeating"], why:"Inigo Quilez 2D SDF — circle wave. A horizontally repeating sinusoidal wave made from arc segments. Uses GLSL-style mod (floor-based) for tiling. The tb parameter controls arc openness, ra the radius, thick adds stroke width. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-030", date:"2026-08-15", type:"gizmo", title:"Compass Field", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); lx = x * cells - gx - 0.5; ly = y * cells - gy - 0.5; tcx = (gx + 0.5) / cells; tcy = (gy + 0.5) / cells; ax = 0.5 + reach * sin(2.0 * t); ay = 0.5 + reach * sin(2.9 * t); angle = atan2(ay - tcy, ax - tcx) + 1.5708; perp = abs(lx * sin(angle) - ly * cos(angle)); along = abs(lx * cos(angle) + ly * sin(angle)); (perp < thick ? 1.0 : 0.0) * (along < len ? 1.0 : 0.0)",
    params:{cells:{value:16,min:4,max:30},reach:{value:0.3,min:0.1,max:0.45},thick:{value:0.04,min:0.01,max:0.15},len:{value:0.35,min:0.1,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","vector-field","compass","direction","animated"], why:"Hair-comb vector field from t06_229. Each tile draws a line segment perpendicular to the direction toward a Lissajous attractor. The +PI/2 offset means the needles trace contour lines, not compass bearings. The field combs itself as the attractor drifts." } },
  { cat:"PP-031", date:"2026-08-15", type:"gizmo", title:"Concentric Pulse", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); 0.5 + 0.5 * sin(d * frequency - t * speed)",
    params:{frequency:{value:40,min:1,max:200},speed:{value:0.1,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","rings","concentric","animated"], why:"Concentric rings from centre with time animation. st_010 step/smoothstep on distance — the falloff law wearing its equation." } },
  { cat:"PP-032", date:"2026-08-15", type:"gizmo", title:"Contour Bands", tags:["Gizmo","Interactive"],
    do_pixel:"n = 0.5 + 0.5 * noise2(x * scale + t * drift, y * scale); 0.5 + 0.5 * cos(n * bands * 6.28318)",
    params:{scale:{value:3,min:0.5,max:20},bands:{value:8,min:1,max:40},drift:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","contour","topographic","noise","animated"], why:"Contour-banding from t06_044 — cos of field equals free topo lines. The net curtains reading. Water contours, topographic maps, terrain." } },
  { cat:"PP-033", date:"2026-08-15", type:"gizmo", title:"Conveyor Dots", tags:["Gizmo","Interactive"],
    do_pixel:"sy = y + t * speed; gx = floor(x * grid_size); gy = floor(sy * grid_size); cx = (gx + 0.5) / grid_size; cy = (gy + 0.5) / grid_size; dy_c = sy - cy; dx_c = x - cx; d = sqrt(dx_c * dx_c + dy_c * dy_c) * grid_size; rx = cx - 0.5; ry = (cy - floor(cy)) - 0.5; rd = sqrt(rx * rx + ry * ry); fall = 1.0 / (1.0 + rd * rd * falloff * falloff); r = 0.35 * fall; smoothstep(r, r * 0.6, d)",
    params:{grid_size:{value:10,min:3,max:40},falloff:{value:3,min:0.5,max:10},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","dots","conveyor","grid","animated"], why:"Dots on a vertical conveyor belt with radial size falloff from centre. t06_034 lattice conveyor." } },
  { cat:"PP-034", date:"2026-08-15", type:"gizmo", title:"Cool S", tags:["Gizmo","Interactive"],
    do_pixel:"px_raw = (x - 0.5) / scale; py_raw = (y - 0.5) / scale; six = py_raw < 0.0 ? -px_raw : px_raw; px = abs(px_raw); qy = abs(py_raw) - 0.2; rex = px - min(round(px / 0.4), 0.4); aby = abs(qy - 0.2) - 0.6; c1 = clamp(0.5 * (six - qy), 0.0, 0.2); v1x = six - c1; v1y = -qy - c1; dd = v1x * v1x + v1y * v1y; c2 = clamp(0.5 * (px - aby), 0.0, 0.4); v2x = px - c2; v2y = -aby - c2; dd = min(dd, v2x * v2x + v2y * v2y); c3 = clamp(qy, 0.0, 0.4); v3x = rex; v3y = qy - c3; dd = min(dd, v3x * v3x + v3y * v3y); s = 2.0 * px + aby + abs(aby + 0.4) - 0.4; d = sqrt(dd) * (s > 0.0 ? 1.0 : -1.0) * scale; smoothstep(blur, 0.0, d)",
    params:{scale:{value:0.3,min:0.1,max:0.5},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","cool-s","curve","iconic"], why:"Inigo Quilez 2D SDF — the Cool S (Super S / Stussy S). The iconic S-shape doodled on every schoolkid's notebook. Six line segments, no curves — the distance is computed to each segment and minimized. Scale controls overall size. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-035", date:"2026-08-15", type:"gizmo", title:"Cosine Ramp", tags:["Gizmo","Interactive"],
    do_pixel:"0.5 + 0.5 * cos(6.28318 * (freq * x + phase + t * speed))",
    params:{freq:{value:2,min:0.5,max:20},phase:{value:0,min:0,max:1},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["ramp","cosine","palette","animated"], why:"Inigo Quilez cosine palette formula: a + b*cos(2pi*(c*t+d)). Here as a greyscale wave across x. The basis of all IQ procedural color work, reduced to one channel. Frequency sets the number of oscillations, phase slides the pattern, speed animates." } },
  { cat:"PP-036", date:"2026-08-15", type:"gizmo", title:"Cracked Mud", tags:["Gizmo","Interactive"],
    do_pixel:"f1 = voronoi2(x * scale + t * drift, y * scale, 1, 1.0); f2 = voronoi2(x * scale + t * drift, y * scale, 2, 1.0); border = f2 - f1; smoothstep(0.0, crack_width, border)",
    params:{scale:{value:6,min:1,max:30},crack_width:{value:0.05,min:0.01,max:0.3},drift:{value:0.005,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["noise","voronoi","cracks","cellular","animated"], why:"Voronoi F2-F1 (border distance), creating cracked/cellular boundaries. st_007 voronoi borders." } },
  { cat:"PP-037", date:"2026-08-15", type:"gizmo", title:"Crescent", tags:["Gizmo","Interactive"],
    do_pixel:"px = x - 0.5; py = abs(y - 0.5); d1 = sqrt(px * px + py * py) - outer; d2 = sqrt((px - offset) * (px - offset) + py * py) - inner; d = max(d1, -d2); smoothstep(blur, 0.0, d)",
    params:{outer:{value:0.25,min:0.1,max:0.45},inner:{value:0.2,min:0.05,max:0.4},offset:{value:0.12,min:0,max:0.35},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","crescent","moon","subtraction"], why:"Crescent moon via SDF boolean subtraction: max(circle, -circle). Outer circle defines the body, inner circle (offset sideways) carves the bite. Three params give full control — from thin sickle to fat gibbous. The oldest shape in the sky, now a distance field. Source: iquilezles.org/articles/distfunctions2d (sdMoon simplified to boolean form)." } },
  { cat:"PP-038", date:"2026-08-15", type:"gizmo", title:"Cross Field", tags:["Gizmo","Interactive"],
    do_pixel:"hd = max(abs(x - 0.5) - arm, abs(y - 0.5) - thick); vd = max(abs(x - 0.5) - thick, abs(y - 0.5) - arm); d = min(hd, vd); smoothstep(blur, 0.0, d)",
    params:{arm:{value:0.3,min:0.05,max:0.48},thick:{value:0.05,min:0.01,max:0.2},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","cross","plus"], why:"Union of two box SDFs — horizontal arm and vertical arm. Medical cross, crosshair, or plus sign as a signed distance field. Arm controls reach, thick controls bar width, blur softens edges. Source: SDF boolean union min(d1,d2) from IQ's 2D distance functions." } },
  { cat:"PP-039", date:"2026-08-15", type:"gizmo", title:"Cross Round", tags:["Gizmo","Interactive"],
    do_pixel:"ppx = abs(x - 0.5); ppy = abs(y - 0.5); sx = ppy > ppx ? ppy : ppx; sy = ppy > ppx ? ppx : ppy; qx = sx - arm; qy = sy - thick; k = max(qy, qx); wx = k > 0.0 ? qx : thick - sx; wy = k > 0.0 ? qy : -k; mwx = max(wx, 0.0); mwy = max(wy, 0.0); d = (k > 0.0 ? 1.0 : -1.0) * sqrt(mwx * mwx + mwy * mwy) + rnd; smoothstep(blur, 0.0, d)",
    params:{arm:{value:0.25,min:0.05,max:0.48},thick:{value:0.06,min:0.02,max:0.2},rnd:{value:-0.02,min:-0.1,max:0.05},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","cross","rounded-corners"], why:"Inigo Quilez 2D SDF — cross with rounded inner corners. Unlike CrossField (union of two boxes) or RoundedCross (rounded elbows), this uses a single distance function with an explicit rounding parameter. Negative rnd smooths the inner concave corners; positive rnd inflates the entire shape. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-03A", date:"2026-08-15", type:"gizmo", title:"Curtain", tags:["Gizmo","Interactive"],
    do_pixel:"wave = sin(y * wave_freq * 6.28318 + t * speed) * wave_amount; lx = (x + wave) * lines; frac = lx - floor(lx); d = abs(frac - 0.5); smoothstep(0.1, 0.0, d)",
    params:{lines:{value:20,min:5,max:80},wave_amount:{value:0.05,min:0,max:0.3},wave_freq:{value:3,min:0.5,max:20},speed:{value:0.05,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","curtain","lines","wave","rain","animated"], why:"Vertical wavy lines like net curtains or rain. t06_044 net curtains." } },
  { cat:"PP-03B", date:"2026-08-15", type:"gizmo", title:"Cut Disk", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; w = sqrt(max(radius * radius - cut * cut, 0.0)); s = max((cut - radius) * px * px + w * w * (cut + radius - 2.0 * py), cut * px - w * py); dl = sqrt(px * px + py * py) - radius; dc = cut - py; de = sqrt((px - w) * (px - w) + (py - cut) * (py - cut)); d = s < 0.0 ? dl : (px < w ? dc : de); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.3,min:0.1,max:0.45},cut:{value:-0.1,min:-0.35,max:0.35},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","disk","cut","truncated"], why:"Inigo Quilez 2D SDF — circle with a horizontal flat cut. Cut controls where the slice goes: negative keeps more disk, positive keeps less. Three-way distance: body of circle, flat edge, or corner. Useful for D-pads, truncated shapes, and any circle that needs a flat bottom. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-03C", date:"2026-08-15", type:"gizmo", title:"Depth Stripes", tags:["Gizmo","Interactive"],
    do_pixel:"py = pow(y + 0.001, perspective); freq = stripe_count * py + t * speed; 0.5 + 0.5 * sin(freq * 6.28318)",
    params:{stripe_count:{value:15,min:2,max:60},perspective:{value:2,min:0.5,max:5},speed:{value:0.03,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","stripes","perspective","depth","animated"], why:"Horizontal stripes with depth-like perspective — spacing decreases toward top. t06_017 boardwalk perspective." } },
  { cat:"PP-03D", date:"2026-08-15", type:"gizmo", title:"Diagonal Flow", tags:["Gizmo","Interactive"],
    do_pixel:"n = noise2(x * noise_scale + t * speed, y * noise_scale) * 0.3; 0.5 + 0.5 * sin((x + y + n) * frequency + t * speed * 2.0)",
    params:{frequency:{value:20,min:2,max:100},noise_scale:{value:3,min:0.5,max:20},speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","diagonal","flow","noise","animated"], why:"Diagonal line pattern with noise displacement — order meets chaos. From t06 diagonal patterns." } },
  { cat:"PP-03E", date:"2026-08-15", type:"gizmo", title:"Diffraction Field", tags:["Gizmo","Interactive"],
    do_pixel:"f = freq * 6.28318; s = t * speed; d1 = sqrt((x - 0.8) * (x - 0.8) + (y - 0.5) * (y - 0.5)); d2 = sqrt((x - 0.65) * (x - 0.65) + (y - 0.76) * (y - 0.76)); d3 = sqrt((x - 0.35) * (x - 0.35) + (y - 0.76) * (y - 0.76)); d4 = sqrt((x - 0.2) * (x - 0.2) + (y - 0.5) * (y - 0.5)); d5 = sqrt((x - 0.35) * (x - 0.35) + (y - 0.24) * (y - 0.24)); d6 = sqrt((x - 0.65) * (x - 0.65) + (y - 0.24) * (y - 0.24)); val = sin(d1 * f - s) + sin(d2 * f - s) + sin(d3 * f - s) + sin(d4 * f - s) + sin(d5 * f - s) + sin(d6 * f - s); 0.5 + val / 12.0",
    params:{freq:{value:20,min:5,max:80},speed:{value:1,min:0,max:5}},
    dna:{ author:"makers-factory", tags:["wave","interference","diffraction","physics","animated"], why:"Six-source wave interference: 6 point sources arranged in a regular hexagon emit circular wavefronts (sin of distance). Superposition creates constructive/destructive interference — bright maxima where waves align, dark minima where they cancel. The pattern is the 2D analogue of a hexagonal diffraction grating. Mined from Shadertoy wave interference simulations." } },
  { cat:"PP-03F", date:"2026-08-15", type:"gizmo", title:"Disco Floor", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); h = abs(sin(gx * 127.1 + gy * 311.7 + t * speed) * 43758.5453); h - floor(h)",
    params:{cells:{value:8,min:2,max:30},speed:{value:0.3,min:0,max:5}},
    dna:{ author:"makers-factory", tags:["pattern","grid","hash","animated","random"], why:"Per-cell hash with time injection — from st_019 hash function in taste_07. Each tile gets a pseudo-random brightness that cycles over time. Speed at zero = static stained glass. Speed up = disco floor." } },
  { cat:"PP-040", date:"2026-08-15", type:"gizmo", title:"Dot Matrix", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * dots); gy = floor(y * dots); cx = (gx + 0.5) / dots; cy = (gy + 0.5) / dots; dx = (x - cx) * dots; dy = (y - cy) * dots; d = sqrt(dx * dx + dy * dy); r = dot_size + 0.05 * sin(t * speed + gx * 0.5 + gy * 0.7); smoothstep(r, r * 0.8, d)",
    params:{dots:{value:16,min:2,max:64},dot_size:{value:0.3,min:0.05,max:0.49},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","dots","grid","halftone","animated"], why:"Regular grid of circular dots, useful as a halftone source. Utility/halftone foundation." } },
  { cat:"PP-041", date:"2026-08-15", type:"gizmo", title:"Droste Spiral", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) + 0.0001; lnr = log(r); th = atan2(dy, dx); sn = 0.0 - log(max(zoom, 0.01)) / 6.28318; nl = pow(2.71828, lnr - th * sn); na = sn * lnr + th + t * speed; nx = nl * cos(na) * scale; ny = nl * sin(na) * scale; 0.5 + 0.5 * noise2(nx, ny)",
    params:{scale:{value:3,min:0.5,max:15},zoom:{value:3,min:1.1,max:10},speed:{value:0.2,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","spiral","droste","fractal","self-similar","animated"], why:"Escher's 'Print Gallery' spiral: w = z^alpha in complex space. The transform maps a pattern into a self-similar spiral — zoom in and the pattern repeats. Log-polar coordinates rotate and scale simultaneously. Mined from Shadertoy conformal mapping and Reinder Nijhoff's Droste implementation." } },
  { cat:"PP-042", date:"2026-08-15", type:"gizmo", title:"Egg", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; rr = 0.5 * (height + bot_r + top_r) / bulge; da = rr - bot_r; db = rr - top_r; vy = (db * db - da * da - height * height) / (2.0 * height); vx = sqrt(max(da * da - vy * vy, 0.0)); k = py * vx - px * vy; dx1 = px + vx; dy1 = py + vy; d1 = sqrt(dx1 * dx1 + dy1 * dy1) - rr; d2a = sqrt(px * px + py * py) - bot_r; dy2 = py - height; d2b = sqrt(px * px + dy2 * dy2) - top_r; d2 = min(d2a, d2b); d = (k > 0.0 && k < height * (px + vx)) ? d1 : d2; smoothstep(blur, 0.0, d)",
    params:{height:{value:0.1,min:0.02,max:0.25},bot_r:{value:0.12,min:0.03,max:0.3},top_r:{value:0.06,min:0.02,max:0.2},bulge:{value:0.5,min:0.2,max:1.5},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","egg","oval","organic"], why:"Inigo Quilez 2D SDF — egg shape. Two circles (bottom radius bot_r, top radius top_r) offset vertically by height, connected by a smooth envelope controlled by bulge. An asymmetric oval with tunable proportions — the parent shape for any tapered organic form. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-043", date:"2026-08-15", type:"gizmo", title:"Elastic Pulse", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); phase = (r - t * speed * 0.05) * freq; envelope = pow(2.71828, 0.0 - phase * phase * damping); osc = cos(phase * 6.28318); 0.5 + 0.5 * envelope * osc",
    params:{freq:{value:8,min:2,max:30},speed:{value:0.3,min:0,max:2},damping:{value:5,min:0.5,max:20}},
    dna:{ author:"makers-factory", tags:["wave","elastic","pulse","shockwave","damped","animated"], why:"Damped oscillating shockwave: a radial wavefront that decays with a Gaussian envelope. The cosine oscillation inside the envelope creates the elastic bounce — rings of alternating bright/dark that fade with distance from the wavefront. Speed moves the wavefront outward over time. Mined from LYGIA animation/easing elastic functions applied spatially." } },
  { cat:"PP-044", date:"2026-08-15", type:"gizmo", title:"Electric Arc", tags:["Gizmo","Interactive"],
    do_pixel:"py = y * freq; n = noise2(py, t * speed); d = abs(x - 0.5 - n * warp); glow = pow(clamp(1.0 - d / thick, 0.0, 1.0), falloff); clamp(glow, 0.0, 1.0)",
    params:{freq:{value:5,min:1,max:20},warp:{value:0.2,min:0.01,max:0.45},thick:{value:0.08,min:0.01,max:0.3},falloff:{value:2,min:0.5,max:6},speed:{value:0.5,min:0,max:5}},
    dna:{ author:"makers-factory", tags:["noise","line","electric","arc","lightning","animated"], why:"A vertical centre-line displaced horizontally by 1D noise sampled along y. pow() falloff gives the glow halo. Speed drives the noise time axis — fast = flickering lightning, slow = drifting smoke trail." } },
  { cat:"PP-045", date:"2026-08-15", type:"gizmo", title:"Ellipse", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); d = (sqrt(px * px / (ax * ax) + py * py / (ay * ay)) - 1.0) * min(ax, ay); smoothstep(blur, 0.0, d)",
    params:{ax:{value:0.25,min:0.03,max:0.48},ay:{value:0.15,min:0.03,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","ellipse","oval"], why:"Approximate 2D SDF for ellipse. Uses the level-set (length(p/ab)-1)*min(ab) approximation rather than the exact Newton-iteration solution. Visually accurate for moderate aspect ratios (up to ~2:1). The exact IQ ellipse requires acos and cube root with branching — deferred to a future version if precision matters. Source: iquilezles.org/articles/distfunctions2d (simplified)" } },
  { cat:"PP-046", date:"2026-08-15", type:"gizmo", title:"Erosion Field", tags:["Gizmo","Interactive"],
    do_pixel:"n1 = noise2(x * scale1 + t * drift, y * scale1); n2 = noise2(x * scale2 + 5.7 + t * drift * 0.7, y * scale2 + 3.1); diff = (n1 - n2) * contrast; clamp(0.5 + diff, 0.0, 1.0)",
    params:{scale1:{value:3,min:0.5,max:20},scale2:{value:6,min:0.5,max:20},contrast:{value:2,min:0.5,max:10},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","erosion","landscape","subtract","animated"], why:"Two noise layers subtracted, creating cliff/erosion boundaries. t06 erosion patterns." } },
  { cat:"PP-047", date:"2026-08-15", type:"gizmo", title:"FBM Noise", tags:["Gizmo","Interactive"],
    do_pixel:"turbulence2(x * scale + t * drift, y * scale, octaves, 2.0, 0.5)",
    params:{scale:{value:4,min:0.5,max:50},octaves:{value:4,min:1,max:8},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["noise","fbm","turbulence","animated"], why:"Fractal Brownian motion noise field. st_004 in taste_07 — the noise rig. Lacunarity 2, gain 0.5 (standard fbm). One abs() is the difference between a cloud and a fire." } },
  { cat:"PP-048", date:"2026-08-15", type:"gizmo", title:"Feather Strands", tags:["Gizmo","Interactive"],
    do_pixel:"sy = y * strand_count; strand = floor(sy); frac = sy - strand; along = x; nx = noise2(strand * 1.7 + t * speed, along * 3.0); disp = nx * wildness * along * along; shifted = frac + disp; d = abs(shifted - 0.5); smoothstep(0.12, 0.0, d)",
    params:{strand_count:{value:30,min:5,max:100},wildness:{value:0.3,min:0,max:2},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","organic","feather","strands","animated"], why:"Parallel strands with noise displacement increasing along their length, like pulling apart a feather. t06_025 pen-walk feather." } },
  { cat:"PP-049", date:"2026-08-15", type:"gizmo", title:"Flame Wisps", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; n = turbulence2(px, py, octaves, 2.0, 0.5); flame = pow(abs(n * 2.0 - 1.0), sharpness); clamp(flame, 0.0, 1.0)",
    params:{scale:{value:4,min:0.5,max:20},octaves:{value:6,min:1,max:8},drift:{value:0.02,min:0,max:0.5},sharpness:{value:2,min:0.5,max:5}},
    dna:{ author:"makers-factory", tags:["noise","flame","fire","turbulence","ridge","animated"], why:"Abs-folded turbulence from st_004 in taste_07. 'One abs() is the difference between a cloud and a fire.' The fold creates ridges and creases. Sharpness dials between fire and cloud." } },
  { cat:"PP-04A", date:"2026-08-15", type:"gizmo", title:"Flower Field", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) + 0.0001; a = atan2(dy, dx) + t * speed; petal = abs(cos(a * petals * 0.5)); d = r - size * petal; smoothstep(blur, 0.0, 0.0 - d)",
    params:{petals:{value:5,min:2,max:16},size:{value:0.35,min:0.1,max:0.5},blur:{value:0.02,min:0.005,max:0.15},speed:{value:0.1,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["sdf","flower","petal","organic","shape","animated"], why:"Flower rosette SDF: radius modulated by abs(cos(angle * N/2)). Creates organic petal shapes — the cosine lobes pull the radius outward at N evenly spaced angles. PolarRose uses sin(n*theta) for a polar curve; this uses abs(cos) for a filled petal shape. Mined from LYGIA sdf/flowerSDF." } },
  { cat:"PP-04B", date:"2026-08-15", type:"gizmo", title:"Flow Noise", tags:["Gizmo","Interactive"],
    do_pixel:"ca = cos(t * speed * 0.5); sa = sin(t * speed * 0.5); rx = (x - 0.5) * scale; ry = (y - 0.5) * scale; nx = rx * ca - ry * sa; ny = rx * sa + ry * ca; n1 = noise2(nx, ny); ca2 = cos(t * speed * 0.7 + 1.0); sa2 = sin(t * speed * 0.7 + 1.0); nx2 = rx * 2.0 * ca2 - ry * 2.0 * sa2 + 5.2; ny2 = rx * 2.0 * sa2 + ry * 2.0 * ca2 + 1.3; n2 = noise2(nx2, ny2); 0.5 + 0.5 * (n1 + n2 * 0.5) / 1.5",
    params:{scale:{value:4,min:1,max:15},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["noise","flow","animated","organic","fluid"], why:"Flow noise: time-rotated coordinate sampling for smooth animation. Instead of sliding through a noise field (which creates visible drift), the sampling coordinates rotate over time — each octave at a different angular speed and phase. The result looks like slowly churning fluid. Two octaves at different frequencies and rotation rates create organic motion. Mined from Shadertoy flow noise implementations and Perlin's original flow noise paper." } },
  { cat:"PP-04C", date:"2026-08-15", type:"gizmo", title:"Folded Wave", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; w = sin(px) + sin(py * 0.7 + px * 0.3); f = abs(w * fold); f - floor(f)",
    params:{scale:{value:8,min:1,max:25},fold:{value:2,min:0.5,max:8},drift:{value:0.03,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","wave","fold","sawtooth","animated"], why:"Folded wave train from t06_051 taste — two sines combined then abs-folded via fract(abs(w*fold)). The fold count multiplies the creases. Low fold = gentle ripple; high fold = corrugated metal / topographic contour stacking." } },
  { cat:"PP-04D", date:"2026-08-15", type:"gizmo", title:"Fractal Kaleido", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) + 0.0001; a = atan2(dy, dx); seg = 6.28318 / max(folds, 1.0); a = a - seg * floor(a / seg + 0.5); a = abs(a); seg2 = seg / max(subfolds, 1.0); a = a - seg2 * floor(a / seg2 + 0.5); a = abs(a); nx = r * cos(a) * scale; ny = r * sin(a) * scale; 0.5 + 0.5 * sin(nx + t * speed) * cos(ny)",
    params:{folds:{value:6,min:2,max:16},subfolds:{value:3,min:1,max:8},scale:{value:5,min:1,max:20},speed:{value:0.3,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","kaleidoscope","fractal","symmetry","fold","animated"], why:"Nested rotational domain folds: the angle is folded into 1/N of the circle (primary folds), then folded again within that sector (subfolds). Two levels of angular abs-fold create nested kaleidoscopic symmetry — a fractal-like pattern from simple sin*cos in the folded domain. Distinct from MandalaFold (single-level fold) by the nested structure. Mined from Shadertoy fractal kaleidoscope shaders." } },
  { cat:"PP-04E", date:"2026-08-15", type:"gizmo", title:"Fractal Spiral", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx); golden = 2.39996; spiral = a - r * count * golden + t * speed * 6.28318; ring = 0.5 + 0.5 * cos(r * count * 6.28318); arm = 0.5 + 0.5 * cos(spiral * 5.0); dot = smoothstep(size + 0.01, size, r * abs(sin(spiral * count * 0.5))); clamp(ring * arm * 0.5 + dot * 0.5, 0.0, 1.0)",
    params:{count:{value:200,min:10,max:500},size:{value:0.02,min:0.005,max:0.1},speed:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","fibonacci","spiral","golden","phyllotaxis","animated"], why:"Fibonacci/golden angle spiral dot pattern. From t06_027 prime-structured arms." } },
  { cat:"PP-04F", date:"2026-08-15", type:"gizmo", title:"Gain Field", tags:["Gizmo","Interactive"],
    do_pixel:"val = sqrt((x - 0.5) * (x - 0.5) + (y - 0.5) * (y - 0.5)) * scale; val = val - floor(val); lo = 0.5 * pow(max(2.0 * val, 0.0001), gain); hi = 1.0 - 0.5 * pow(max(2.0 - 2.0 * val, 0.0001), gain); (val < 0.5) ? lo : hi",
    params:{scale:{value:3,min:1,max:10},gain:{value:2,min:0.5,max:8}},
    dna:{ author:"makers-factory", tags:["gradient","gain","contrast","remap","radial"], why:"Perlin's gain function applied spatially: redistributes a radial gradient's contrast. gain<1 flattens midtones (S-curve inverted), gain>1 pushes values toward 0 and 1 (S-curve). The formula 0.5*pow(2x,k) / 1-0.5*pow(2-2x,k) is symmetric and C1-continuous at x=0.5. Applied to a repeating radial distance field, it sculpts the brightness profile of concentric rings. Mined from LYGIA math/gain and Perlin's bias/gain paper." } },
  { cat:"PP-050", date:"2026-08-15", type:"gizmo", title:"Gaussian Spot", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r2 = dx * dx + dy * dy; pow(2.71828, 0.0 - r2 / max(sigma * sigma * 2.0, 0.0001)) * brightness",
    params:{sigma:{value:0.15,min:0.02,max:0.5},brightness:{value:1,min:0.1,max:3}},
    dna:{ author:"makers-factory", tags:["falloff","gaussian","bell","soft","spotlight"], why:"True Gaussian bell curve applied radially: exp(-r^2 / 2*sigma^2). Unlike smoothstep or polynomial falloffs, this is the exact normal distribution shape — maximum at center, exponential decay, no hard edge. Sigma controls spread, brightness controls peak amplitude. The most physically correct soft spotlight. Mined from LYGIA draw/ Gaussian functions." } },
  { cat:"PP-051", date:"2026-08-15", type:"gizmo", title:"Gear Wheel", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy); a = atan2(dy, dx) + t * speed; tooth = depth * clamp(sin(a * teeth) * sharp, -1.0, 1.0) * 0.5 + depth * 0.5; gear_r = radius + tooth; d_outer = r - gear_r; d_inner = hub - r; d = max(d_outer, d_inner); smoothstep(0.005, 0.0, d)",
    params:{teeth:{value:12,min:3,max:40},radius:{value:0.25,min:0.1,max:0.45},depth:{value:0.06,min:0.01,max:0.15},hub:{value:0.08,min:0.02,max:0.2},sharp:{value:5,min:1,max:20},speed:{value:0.1,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["sdf","gear","mechanical","shape","animated"], why:"Toothed gear SDF: polar distance modulated by clamped sine for tooth profiles. The sharp param controls tooth squareness — low values give rounded bumps, high values give flat-topped teeth. Hub param carves the center hole. Mined from LYGIA sdf/gearSDF and Shadertoy mechanical pattern studies." } },
  { cat:"PP-052", date:"2026-08-15", type:"gizmo", title:"Geometric Decay", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; d = sqrt(dx * dx + dy * dy); s = 1.0; total = 0.0; s = s * decay; r1 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r1 * s); s = s * decay; r2 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r2 * s); s = s * decay; r3 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r3 * s); s = s * decay; r4 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r4 * s); s = s * decay; r5 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r5 * s); s = s * decay; r6 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r6 * s); s = s * decay; r7 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r7 * s); s = s * decay; r8 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r8 * s); s = s * decay; r9 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r9 * s); s = s * decay; r10 = smoothstep(s + 0.005, s - 0.005, d); total = max(total, r10 * s); a = atan2(dy, dx); wave = 0.5 + 0.5 * sin(a * count + t * drift * 6.28318); total * wave",
    params:{count:{value:30,min:4,max:64},decay:{value:0.93,min:0.8,max:0.99},drift:{value:0.01,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","geometric","decay","tunnel","perspective","animated"], why:"Nested circles with geometric size decay — each circle 0.93x the last. Tunnel/perspective illusion. From t06_046 geometric-decay tunnel." } },
  { cat:"PP-053", date:"2026-08-15", type:"gizmo", title:"Gerstner Wave", tags:["Gizmo","Interactive"],
    do_pixel:"k = 6.28318 / max(wavelength, 0.01); px = (x * cos(direction) + y * sin(direction)) * scale; ph = px * k - t * speed * sqrt(9.8 * scale / max(k, 0.01)); h = sin(ph - steepness * sin(ph)); 0.5 + 0.5 * h",
    params:{scale:{value:3,min:0.5,max:15},wavelength:{value:0.5,min:0.05,max:2},steepness:{value:0.7,min:0,max:0.99},direction:{value:0.5,min:0,max:6.28},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["wave","ocean","gerstner","physics","water","animated"], why:"Gerstner ocean wave: sin(x - A*sin(x)) creates peaked crests and flat troughs, unlike regular sine waves. Steepness parameter A controls cusp sharpness — at 0 it is a sine wave, approaching 1 the crests become knife-sharp. The dispersion relation sqrt(g/k) gives physically correct wave speed. Mined from LYGIA generative/gerstnerWave and ocean rendering literature." } },
  { cat:"PP-054", date:"2026-08-15", type:"gizmo", title:"Gradient Noise", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale + t * drift; py = y * scale; ix = floor(px); iy = floor(py); fx = px - ix; fy = py - iy; ux = fx * fx * (3.0 - 2.0 * fx); uy = fy * fy * (3.0 - 2.0 * fy); a00 = abs(sin(ix * 127.1 + iy * 311.7) * 43758.5453); a00 = (a00 - floor(a00)) * 6.2832; a10 = abs(sin((ix + 1.0) * 127.1 + iy * 311.7) * 43758.5453); a10 = (a10 - floor(a10)) * 6.2832; a01 = abs(sin(ix * 127.1 + (iy + 1.0) * 311.7) * 43758.5453); a01 = (a01 - floor(a01)) * 6.2832; a11 = abs(sin((ix + 1.0) * 127.1 + (iy + 1.0) * 311.7) * 43758.5453); a11 = (a11 - floor(a11)) * 6.2832; d00 = cos(a00) * fx + sin(a00) * fy; d10 = cos(a10) * (fx - 1.0) + sin(a10) * fy; d01 = cos(a01) * fx + sin(a01) * (fy - 1.0); d11 = cos(a11) * (fx - 1.0) + sin(a11) * (fy - 1.0); m0 = d00 + ux * (d10 - d00); m1 = d01 + ux * (d11 - d01); n = m0 + uy * (m1 - m0); 0.5 + 0.5 * n",
    params:{scale:{value:5,min:1,max:30},drift:{value:0.01,min:0,max:0.2}},
    dna:{ author:"makers-factory", tags:["noise","gradient","perlin","smooth","animated"], why:"Perlin gradient noise: hash to random gradient vector per grid corner, dot product with displacement, smooth cubic interpolation. From Book of Shaders ch.11 — the algorithm that changed procedural graphics. Distinct from value noise (interpolates scalars, creating blocky artifacts): gradient noise interpolates vectors, giving smooth directional lobes without grid alignment." } },
  { cat:"PP-055", date:"2026-08-15", type:"gizmo", title:"Grid Warp", tags:["Gizmo","Interactive"],
    do_pixel:"wx = noise2(x * noise_scale + t * speed, y * noise_scale) * warp_amount; wy = noise2(x * noise_scale + 5.5, y * noise_scale + 3.3 + t * speed) * warp_amount; gx = sin((x + wx) * grid_freq * 6.28318); gy = sin((y + wy) * grid_freq * 6.28318); v = max(abs(gx), abs(gy)); smoothstep(0.9, 1.0, v)",
    params:{grid_freq:{value:10,min:2,max:40},warp_amount:{value:0.05,min:0,max:0.3},noise_scale:{value:3,min:0.5,max:15},speed:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","grid","warp","noise","deformation","animated"], why:"Regular grid deformed by noise displacement. Warped grid patterns." } },
  { cat:"PP-056", date:"2026-08-15", type:"gizmo", title:"Gyroid Slice", tags:["Gizmo","Interactive"],
    do_pixel:"px = x * scale; py = y * scale; pz = t * drift; g = sin(px) * cos(py) + sin(py) * cos(pz) + sin(pz) * cos(px); clamp(1.0 - abs(g) / thresh, 0.0, 1.0)",
    params:{scale:{value:8,min:1,max:25},thresh:{value:0.3,min:0.05,max:1},drift:{value:0.02,min:0,max:0.3}},
    dna:{ author:"makers-factory", tags:["pattern","gyroid","minimal-surface","organic","animated"], why:"The gyroid: sin(x)cos(y)+sin(y)cos(z)+sin(z)cos(x)=0. A triply-periodic minimal surface sliced by the z=t*drift plane. Nature uses it in butterfly wings and bone marrow. Threshold controls the wall thickness of the labyrinth." } },
  { cat:"PP-057", date:"2026-08-15", type:"gizmo", title:"Halftone Grid", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * grid_size); gy = floor(y * grid_size); cx = (gx + 0.5) / grid_size; cy = (gy + 0.5) / grid_size; dx = x - cx; dy = y - cy; dist = sqrt(dx * dx + dy * dy) * grid_size; wave = 0.5 + 0.5 * sin(cx * wave_freq * 6.28318 + cy * wave_freq * 3.14159 + t * wave_speed); dot_radius = wave * 0.5; smoothstep(dot_radius + 0.02, dot_radius - 0.02, dist)",
    params:{grid_size:{value:16,min:4,max:64},wave_freq:{value:2,min:0.5,max:10},wave_speed:{value:0.05,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["pattern","halftone","dots","print","animated"], why:"Dots sized by a wave field — halftone print effect. From t06 halftone patterns." } },
  { cat:"PP-058", date:"2026-08-15", type:"gizmo", title:"Hash Grain", tags:["Gizmo","Interactive"],
    do_pixel:"seed = x * 94723.18 + y * 68107.29 + t * grain_speed * 173.91; h = abs(sin(seed) * 43758.5453); h = h - floor(h); h * intensity",
    params:{intensity:{value:0.5,min:0,max:1},grain_speed:{value:1,min:0,max:10}},
    dna:{ author:"makers-factory", tags:["noise","grain","film","static","hash","animated"], why:"Incoherent static/film grain: a high-frequency hash with no spatial coherence — each pixel gets an independent random value. Unlike noise2 (spatially smooth), this mimics photographic film grain or analog TV static. The large coordinate multipliers ensure decorrelation across adjacent pixels. Grain_speed controls temporal flickering rate. Mined from LYGIA generative/random and film grain shader techniques." } },
  { cat:"PP-059", date:"2026-08-15", type:"gizmo", title:"Heart", tags:["Gizmo","Interactive"],
    do_pixel:"dx = (x - 0.5) * scale; dy = (0.4 - y) * scale; r2 = dx * dx + dy * dy; h = r2 - 1.0; d = h * h * h - dx * dx * dy * dy * dy; clamp(-d * edge, 0.0, 1.0)",
    params:{scale:{value:3,min:1.5,max:8},edge:{value:50,min:5,max:500}},
    dna:{ author:"makers-factory", tags:["sdf","shape","heart","algebraic"], why:"Algebraic heart curve: (x^2+y^2-1)^3 - x^2*y^3 = 0. The implicit equation that every Valentine card is built on whether it knows it or not. Scale controls size, edge controls boundary sharpness. Centered slightly above middle for visual balance (more bulk in the two bumps than the single point)." } },
  { cat:"PP-05A", date:"2026-08-15", type:"gizmo", title:"Hexagon", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); dot = min(-0.866025 * px + 0.5 * py, 0.0); px = px + 1.732050 * dot; py = py - dot; px = px - clamp(px, -0.57735 * radius, 0.57735 * radius); py = py - radius; d = sqrt(px * px + py * py) * (py > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.25,min:0.05,max:0.48},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","hexagon","polygon"], why:"Inigo Quilez 2D SDF — regular hexagon via reflection folding. One reflection reduces the full hexagon to a single sector, then distance to the edge. The hex is the tile that bees discovered and GPUs keep rediscovering. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-05B", date:"2026-08-15", type:"gizmo", title:"Hexagram", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = abs(y - 0.5); d1 = min(-0.5 * px + 0.866025 * py, 0.0); px = px + d1; py = py - 1.732051 * d1; d2 = min(0.866025 * px - 0.5 * py, 0.0); px = px - 1.732051 * d2; py = py + d2; px = px - clamp(px, radius * 0.577350, radius * 1.732051); py = py - radius; d = sqrt(px * px + py * py) * (py > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{radius:{value:0.2,min:0.05,max:0.4},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","hexagram","star","six-pointed"], why:"Inigo Quilez 2D SDF — hexagram (Star of David). Two reflections with hex symmetry constants. The six-pointed star formed by overlapping two equilateral triangles. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-05C", date:"2026-08-15", type:"gizmo", title:"Hex Grid", tags:["Gizmo","Interactive"],
    do_pixel:"sx = x * scale; sy = y * scale * 1.1547; row = floor(sy); off = (row % 2) * 0.5; col = floor(sx + off); cx = col - off + 0.5; cy = (row + 0.5) / 1.1547; dx1 = abs(x * scale - cx); dy1 = abs(y * scale * 1.1547 - (row + 0.5)); cx2 = col + 1.0 - off + 0.5; dx2 = abs(x * scale - cx2); d1 = max(dx1, dy1 * 0.5 + dx1 * 0.5); d2 = max(dx2, dy1 * 0.5 + dx2 * 0.5); d = min(d1, d2); edge = abs(d - 0.5); smoothstep(thickness, 0.0, edge)",
    params:{scale:{value:8,min:2,max:30},thickness:{value:0.05,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","hex","grid","tiling","geometric"], why:"Hexagonal tiling pattern. Geometric tiling." } },
  { cat:"PP-05D", date:"2026-08-15", type:"gizmo", title:"Hex Truchet", tags:["Gizmo","Interactive"],
    do_pixel:"sx = x * cells; sy = y * cells * 1.1547; row = floor(sy); parity = row - floor(row * 0.5) * 2.0; col = floor(sx - parity * 0.5); fx = sx - col - parity * 0.5 - 0.5; fy = sy - row - 0.5; h = abs(sin(col * 127.1 + row * 311.7) * 43758.5453); h = h - floor(h); a = floor(h * 6.0) * 1.0472; rx = fx * cos(a) - fy * sin(a); ry = fx * sin(a) + fy * cos(a); d1 = abs(sqrt((rx + 0.5) * (rx + 0.5) + ry * ry) - 0.3); d2 = abs(sqrt((rx - 0.25) * (rx - 0.25) + (ry - 0.433) * (ry - 0.433)) - 0.3); d3 = abs(sqrt((rx - 0.25) * (rx - 0.25) + (ry + 0.433) * (ry + 0.433)) - 0.3); d = min(d1, min(d2, d3)); smoothstep(width, 0.0, d)",
    params:{cells:{value:6,min:2,max:20},width:{value:0.06,min:0.01,max:0.2}},
    dna:{ author:"makers-factory", tags:["pattern","truchet","hexagonal","grid","arcs"], why:"Truchet tiling on a hexagonal grid: each hex cell gets one of 6 random orientations (60-degree increments), arcs drawn at the three alternating hex corners. The hex offset-row grid uses parity = row mod 2 to stagger columns. Creates flowing maze-like paths with hexagonal symmetry, distinct from square TruchetTile. Mined from Shadertoy hex Truchet variations." } },
  { cat:"PP-05E", date:"2026-08-15", type:"gizmo", title:"Horseshoe", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; cx = sin(opening); cy = cos(opening); l = sqrt(px * px + py * py); rx = -cx * px + cy * py; ry = cy * px + cx * py; fx = max(ry, rx) > 0.0 ? rx : l * (-cx > 0.0 ? 1.0 : -1.0); fy = rx > 0.0 ? ry : l; gx = fx - leg_w; gy = abs(fy - radius) - leg_len; mx = max(gx, 0.0); my = max(gy, 0.0); d = sqrt(mx * mx + my * my) + min(0.0, max(gx, gy)); smoothstep(blur, 0.0, d)",
    params:{opening:{value:1.2,min:0.3,max:2.5},radius:{value:0.2,min:0.05,max:0.35},leg_w:{value:0.04,min:0.01,max:0.1},leg_len:{value:0.08,min:0.02,max:0.2},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","horseshoe","arc","omega"], why:"Inigo Quilez 2D SDF — horseshoe shape. A thick arc with straight legs extending from each end. Opening controls the bend angle, radius sets the curve, leg_w and leg_len control the straight extensions. The magnet, the omega, the tuning fork — any shape that bends then straightens. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-05F", date:"2026-08-15", type:"gizmo", title:"Hyperbola", tags:["Gizmo","Interactive"],
    do_pixel:"ax = abs(x - 0.5); ay = abs(y - 0.5); px = (ax - ay) * 0.70710678; py = (ax + ay) * 0.70710678; x2 = px * px / 16.0; y2 = py * py / 16.0; rr = hk * (4.0 * hk - px * py) / 12.0; qq = (x2 - y2) * hk * hk; hh = qq * qq + rr * rr * rr; mr = sqrt(max(-rr, 0.000000001)); vc = rr * mr; aarg = clamp(qq / (abs(vc) > 0.000000001 ? vc : 0.000000001), -1.0, 1.0); u1 = mr * cos(acos(aarg) / 3.0); sm = sqrt(max(abs(hh), 0.0)); mq = pow(max(sm - qq, 0.000000001), 0.333333333); u2 = (mq - rr / (abs(mq) > 0.000000001 ? mq : 0.000000001)) / 2.0; uu = hh < 0.0 ? u1 : u2; ww = sqrt(max(uu + x2, 0.0)); bb = hk * py - x2 * px * 2.0; wd = ww > 0.0001 ? bb / (ww * 4.0) : 0.0; inner = 2.0 * x2 - uu + wd; tt = px / 4.0 - ww + sqrt(max(inner, 0.0)); hbound = sqrt(hhe * hhe * 0.5 + hk) - hhe * 0.70710678; tt = max(tt, hbound); fy = hk / (abs(tt) > 0.0001 ? tt : 0.0001); dx = px - tt; dy = py - fy; dd = sqrt(dx * dx + dy * dy); d = px * py < hk ? dd : -dd; smoothstep(blur, 0.0, d)",
    params:{hk:{value:0.02,min:0.005,max:0.1},hhe:{value:0.2,min:0.05,max:0.4},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","hyperbola","conic","curve"], why:"Inigo Quilez 2D SDF — bounded hyperbola xy=k. Rotates 45 degrees to align the asymptotes, then solves a quartic (reduced to cubic via resolvent) for the closest point. hk controls the hyperbola constant, hhe bounds the arm length. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-060", date:"2026-08-15", type:"gizmo", title:"Interference", tags:["Gizmo","Interactive"],
    do_pixel:"dx1 = x - 0.5 + separation * 0.5; dy1 = y - 0.5; d1 = sqrt(dx1 * dx1 + dy1 * dy1); dx2 = x - 0.5 - separation * 0.5; dy2 = y - 0.5; d2 = sqrt(dx2 * dx2 + dy2 * dy2); w1 = sin(d1 * freq - t * speed); w2 = sin(d2 * freq - t * speed); 0.5 + 0.25 * (w1 + w2)",
    params:{freq:{value:30,min:5,max:200},separation:{value:0.3,min:0,max:1},speed:{value:0.05,min:0,max:2}},
    dna:{ author:"makers-factory", tags:["pattern","interference","wave","physics","animated"], why:"Two wave sources creating interference pattern. Wave interference physics." } },
  { cat:"PP-061", date:"2026-08-15", type:"gizmo", title:"Isosceles Triangle", tags:["Gizmo","Interactive"],
    do_pixel:"px = abs(x - 0.5); py = y - 0.5; qx = half_w; qy = height; dpq = px * qx + py * qy; dqq = qx * qx + qy * qy + 0.0001; ta = clamp(dpq / dqq, 0.0, 1.0); aax = px - qx * ta; aay = py - qy * ta; tb = clamp(px / (qx + 0.0001), 0.0, 1.0); bbx = px - qx * tb; bby = py - qy; ss = qy > 0.0 ? -1.0 : 1.0; da = aax * aax + aay * aay; sa = ss * (px * qy - py * qx); db = bbx * bbx + bby * bby; sb = ss * (py - qy); finx = min(da, db); finy = min(sa, sb); d = -sqrt(finx) * (finy > 0.0 ? 1.0 : -1.0); smoothstep(blur, 0.0, d)",
    params:{half_w:{value:0.2,min:0.03,max:0.45},height:{value:0.25,min:0.05,max:0.45},blur:{value:0.01,min:0.001,max:0.1}},
    dna:{ author:"makers-factory", tags:["sdf","shape","triangle","isosceles","polygon"], why:"Inigo Quilez 2D SDF — isosceles triangle. A triangle with two equal sides, defined by half-width at the base and height to the apex. Sharper and more directional than the equilateral triangle — the arrowhead, the pointer, the play button. Source: iquilezles.org/articles/distfunctions2d" } },
  { cat:"PP-062", date:"2026-08-15", type:"gizmo", title:"Jitter Dots", tags:["Gizmo","Interactive"],
    do_pixel:"gx = floor(x * cells); gy = floor(y * cells); fx = x * cells - gx; fy = y * cells - gy; h1 = abs(sin(gx * 127.1 + gy * 311.7) * 43758.5453); h1 = h1 - floor(h1); h2 = abs(sin(gx * 269.5 + gy * 183.3) * 43758.5453); h2 = h2 - floor(h2); ox = (h1 - 0.5) * jitter; oy = (h2 - 0.5) * jitter; dx = fx - 0.5 - ox; dy = fy - 0.5 - oy; dd = sqrt(dx * dx + dy * dy); clamp(1.0 - dd / radius, 0.0, 1.0)",
    params:{cells:{value:12,min:3,max:40},radius:{value:0.3,min:0.05,max:0.5},jitter:{value:0.4,min:0,max:1}},
    dna:{ author:"makers-factory", tags:["pattern","grid","dots","halftone","jitter"], why:"Halftone jitter-grid from t06_026 taste. One dot per cell, position randomized by per-cell hash. Jitter at 0 = perfect grid of dots. Jitter at 1 = scattered but still one-per-cell — the Poisson-like guarantee that prevents clumping." } },
  { cat:"PP-063", date:"2026-08-15", type:"gizmo", title:"Joukowski Warp", tags:["Gizmo","Interactive"],
    do_pixel:"cx = (x - 0.5) * scale + offset; cy = (y - 0.5) * scale; r2 = cx * cx + cy * cy + 0.001; jx = cx + cx / r2; jy = cy - cy / r2; 0.5 + 0.5 * sin(jx * freq + t * speed) * cos(jy * freq)",
    params:{scale:{value:2,min:0.5,max:8},freq:{value:4,min:1,max:20},offset:{value:0.2,min:-0.5,max:0.5},speed:{value:0.5,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["warp","conformal","joukowski","airfoil","complex","animated"], why:"Joukowski conformal map: z + 1/z transforms circles into airfoil shapes. The offset parameter shifts the circle center off-origin, controlling asymmetry — at 0 it produces a flat plate, nonzero creates cambered airfoils. Visualised with sin*cos stripe pattern in the warped domain. Mined from Shadertoy conformal mapping and aerodynamics literature." } },
  { cat:"PP-064", date:"2026-08-15", type:"gizmo", title:"Julia Set", tags:["Gizmo","Interactive"],
    do_pixel:"ax = (x - 0.5) * zoom; ay = (y - 0.5) * zoom; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; bx = ax*ax - ay*ay + cr; by = 2.0*ax*ay + ci; ax = bx*bx - by*by + cr; ay = 2.0*bx*by + ci; d = ax*ax + ay*ay; (d == d) ? smoothstep(escape, 0.0, d) : 0.0",
    params:{zoom:{value:3,min:0.5,max:10},cr:{value:-0.7,min:-2,max:2},ci:{value:0.27,min:-2,max:2},escape:{value:4,min:1,max:100}},
    dna:{ author:"makers-factory", tags:["fractal","julia","iteration","complex"], why:"Julia set — 20 unrolled iterations of z^2+c where c=(cr,ci) is a constant parameter and z0=(x,y). Each c value reveals a different fractal coastline. Default cr=-0.7, ci=0.27 gives the classic dendrite Julia set. Slide cr/ci to explore the family — every point on the Mandelbrot boundary generates a connected Julia set." } },
  { cat:"PP-065", date:"2026-08-15", type:"gizmo", title:"Kaleidoscope", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) * zoom; a = atan2(dy, dx) + t * spin; seg = 6.28318 / slices; a = a % seg; a = (a > seg * 0.5) ? seg - a : a; out_x = 0.5 + r * cos(a); out_y = 0.5 + r * sin(a)",
    params:{slices:{value:6,min:2,max:24},zoom:{value:1,min:0.1,max:10},spin:{value:0.02,min:0,max:0.5}},
    dna:{ author:"makers-factory", tags:["transform","polar","kaleidoscope","symmetry","animated"], why:"Polar fold — convert to polar, mod angle by TAU/slices, abs to mirror. UV remapping transform: says where to look, host does the looking. Corrected from generator to transform, session 22." } },
  { cat:"PP-066", date:"2026-08-15", type:"gizmo", title:"Light Shaft", tags:["Gizmo","Interactive"],
    do_pixel:"n = noise2(x * freq, t * drift); shaft = pow(clamp(n, 0.0, 1.0), focus); fade = 1.0 - abs(y - 0.5) * 2.0; clamp(shaft * clamp(fade, 0.0, 1.0), 0.0, 1.0)",
    params:{freq:{value:5,min:1,max:20},drift:{value:0.02,min:0,max:0.3},focus:{value:3,min:0.5,max:8}},
    dna:{ author:"makers-factory", tags:["noise","light","shaft","volumetric","animated"], why:"1D noise sampled along x, extruded vertically, pow-focused into shafts. The vertical fade gives them the 'god ray through trees' shape. Focus at 1 = broad wash; focus at 8 = needle shafts." } },
  { cat:"PP-067", date:"2026-08-15", type:"gizmo", title:"Log Polar Warp", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) + 0.0001; a = atan2(dy, dx); lr = log(r) * scale; aa = a * arms; 0.5 + 0.5 * sin(lr + aa + t * speed)",
    params:{scale:{value:3,min:0.5,max:15},arms:{value:3,min:1,max:12},speed:{value:0.3,min:0,max:3}},
    dna:{ author:"makers-factory", tags:["pattern","spiral","polar","logarithmic","warp","animated"], why:"Log-polar coordinate transform: log(r) makes concentric circles equidistant on a log scale, adding the angle creates logarithmic spirals. Any horizontal pattern in log-polar space becomes a spiral in Cartesian. The arms param controls spiral count. Mined from Shadertoy conformal mapping techniques." } },
  { cat:"PP-068", date:"2026-08-15", type:"gizmo", title:"Log Spiral", tags:["Gizmo","Interactive"],
    do_pixel:"dx = x - 0.5; dy = y - 0.5; r = sqrt(dx * dx + dy * dy) + 0.0001; th = atan2(dy, dx) + t * speed; lnr = log(r); residual = lnr / max(abs(growth), 0.01) - th; wrapped = residual - floor(residual / 6.28318 + 0.5) * 6.28318; d = abs(wrapped) * r; smoothstep(width, 0.0, d)",
    params:{growth:{value:0.2,min:0.01,max:1},width:{value:0.05,min:0.01,max:0.2},speed:{value:0.3,min:0,max:2}},
